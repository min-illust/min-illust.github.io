# Min. CREATIVE LOG 管理画面の設定
backend:
  name: github
  repo: min-illust/min-illust.github.io
  branch: main
  base_url: https://api.netlify.com
  site_domain: min-illust.netlify.app

locale: ja
site_url: https://min-illust.github.io/
display_url: https://min-illust.github.io/

# 管理画面から上げた画像の保存場所（サイトには自動で軽くした版が出ます）
media_folder: images
public_folder: /images

collections:
  # ── 作品（1件ずつ保存） ──
  - name: posts
    label: 作品
    label_singular: 作品
    folder: content/posts
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: date  # タイトルは任意なので、必ず入る日付を識別用にする
    summary: "{{date}}｜{{category}}｜{{work}}{{work_name}}　{{title}}"
    sortable_fields: [date, work, category]
    view_groups:
      - { label: 作品, field: work }
      - { label: 分類, field: category }
    view_filters:
      - { label: ピックアップだけ, field: pickup, pattern: true }
    editor: { preview: false }
    fields:
      - { name: title, label: 管理用メモ（任意・サイトには出ません）, widget: string, required: false, hint: "管理画面の一覧で見分けるためのメモ。サイトでは作品名・キャラ名が名前として出ます" }
      - { name: date, label: 日付, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}" }
      - name: category
        label: 分類
        widget: relation
        collection: settings
        file: categories
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
        value_field: "categories.*.name"
      - name: work
        label: キャラぷの作品（一覧から選ぶ）
        widget: relation
        collection: characters
        search_fields: [title]
        display_fields: [title]
        value_field: title
        options_length: 100
        required: false
        hint: "キャラ（リンク集）に登録した作品から選びます。オリジナルは選ばなくてOK（分類をORIGINALにすると自動で「オリジナル」になります）"
      - { name: work_name, label: 作品名（一覧にないとき・MVは曲名）, widget: string, required: false, hint: "まだキャラ（リンク集）に登録していない作品はここに手入力。あとで同じ名前で登録すると自動で結びつきます" }
      - name: charas
        label: キャラ名（選んだ作品の登場キャラから・複数OK・任意）
        widget: relation
        collection: characters
        value_field: "charas.*"
        search_fields: ["charas.*"]
        display_fields: ["charas.*"]
        multiple: true
        required: false
        filters: [{ field: title, values: ["{{fields.work}}"] }]
        hint: "全部の画像に付きます。1人だけの作品なら空でOK（自動で入ります）。/admin2/ では上で選んだ作品のキャラだけが候補に出ます"
      - { name: charas_free, label: キャラ名（一覧にないとき・オリジナル・手入力）, label_singular: キャラ名, widget: list, required: false, hint: "名前のあるオリジナルキャラや、まだ登録していないキャラ" }
      - name: images
        label: 画像（複数OK・任意）
        label_singular: 画像
        widget: list
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { name: src, label: 画像, widget: image, choose_url: false }
          - { name: caption, label: 一言（任意・拡大したときに絵の下に出ます）, widget: string, required: false }
          - { name: cover, label: 表紙にする（新着の1枚目になります。なしなら1枚目の画像）, widget: boolean, default: false, required: false }
          - name: charas
            label: この画像のキャラ（任意・空なら投稿のキャラ名）
            widget: relation
            collection: characters
            value_field: "charas.*"
            search_fields: ["charas.*"]
            display_fields: ["charas.*"]
            multiple: true
            required: false
            filters: [{ field: title, values: ["{{fields.work}}"] }]
          - { name: tags, label: この画像のタグ（任意・カンマ区切り）, widget: list, required: false, hint: "投稿全体のタグに追加で付きます（スーツ・眼鏡など）" }
      - { name: images_bulk, label: 画像（まとめて追加・任意）, widget: image, multiple: true, required: false, choose_url: false, hint: "複数の画像をまとめて選べます（/admin2/ の管理画面）。一言や表紙を付けたい画像は上の「画像」の欄へ。ここの画像は上の画像のあとに並びます" }
      - { name: bulk_captions, label: まとめて追加した画像の一言（任意・上から順に1行ずつ）, widget: text, required: false, hint: "1行目が1枚目、2行目が2枚目…。一言がいらない画像は空の行にしてください" }
      - { name: bulk_tags, label: まとめて追加した画像のタグ（任意・上から順に1行ずつ・1行の中はカンマ区切り）, widget: text, required: false, hint: "例：1行目「ハロウィン, 仮装」2行目「仕事」。タグがいらない画像は空の行に" }
      - { name: bulk_cover, label: まとめて追加した画像で表紙にするもの（任意・何枚目か）, widget: number, value_type: int, min: 1, required: false, hint: "例：3 なら、まとめて追加した3枚目が表紙（新着の1枚目）。上の「画像」の欄で表紙にチェックがあればそちらが優先" }
      - name: media
        label: 曲・動画のURL（Suno / YouTube・任意）
        label_singular: URL
        widget: list
        required: false
        hint: "Sunoの曲ページ、YouTubeの動画ページ（限定公開もOK）のURLを貼ってください"
        field: { name: url, label: URL, widget: string }
      - { name: comment, label: コメント（任意）, widget: text, required: false }
      - { name: tags, label: タグ（全部の画像に共通・ハロウィンなど・カンマ区切り・任意）, widget: list, required: false, hint: "作品名とキャラ名は自動でタグになるので、ここには入れなくてOK。画像ごとのタグは「画像」の枠の中へ" }
      - { name: charapu, label: キャラぷのURL（あるときだけ）, widget: string, required: false, hint: "入れると「このキャラと話す」ボタンが出ます" }
      - { name: pickup, label: ピックアップ（将来のポートフォリオ用・今はサイトに表示されません）, widget: boolean, default: false, required: false }

  # ── キャラリンク集（/chara/ に表示・キャラぷに貼る用） ──
  - name: characters
    label: キャラ（リンク集）
    label_singular: キャラ
    description: "キャラぷに貼るキャラリンク集（/chara/）。ここに入れたキャラぷのURL以外へのリンクは出ません。"
    folder: content/characters
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{published}}｜{{category}}｜{{title}}"
    sortable_fields: [published, title, category]
    view_groups:
      - { label: カテゴリー, field: category }
    editor: { preview: false }
    fields:
      - { name: title, label: キャラ名（作品名）, widget: string }
      - { name: published, label: 公開日, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - name: category
        label: カテゴリー
        widget: select
        options: ["1:1ロールプレイ", "シミュレーション"]
        default: "1:1ロールプレイ"
      - name: genres
        label: ジャンル（複数OK）
        widget: select
        multiple: true
        min: 1
        options: ["恋愛", "日常・現代", "ファンタジー", "BL", "その他"]
      - { name: tagline, label: 一言紹介（キャラぷと同じ説明文・あらすじがないときに出ます）, widget: text, required: false }
      - { name: synopsis, label: あらすじ（短め・作品ページの最初に出ます）, widget: text, required: false, hint: "2〜4行くらいがおすすめ。入れると作品ページでは一言紹介の代わりにこちらが出ます" }
      - name: profiles
        label: キャラプロフィール（ここでしか見られない情報・任意）
        label_singular: キャラ
        widget: list
        required: false
        summary: "{{fields.name}}"
        hint: "シミュなら1人ずつ追加。内容が空の項目はサイトに出ません。物語のネタバレになる情報は入れない方が安心です"
        fields:
          - { name: name, label: キャラ名, widget: string }
          - { name: birthday, label: 誕生日（任意・例：3/14）, widget: string, required: false, hint: "「3/14」や「3月14日」の形で。当日はサイトに🎂マークが付きます" }
          - name: items
            label: 項目（追加・削除・並べ替えOK）
            label_singular: 項目
            widget: list
            required: false
            summary: "{{fields.label}}：{{fields.value}}"
            default: [{ label: 血液型 }, { label: 身長 }, { label: 好きな食べ物 }, { label: 苦手なもの }, { label: 趣味 }]
            fields:
              - { name: label, label: 項目名, widget: string }
              - { name: value, label: 内容, widget: string, required: false }
      - { name: charas, label: 登場キャラ名（複数OK）, label_singular: キャラ名, widget: list, required: false, hint: "シミュなら全員分。作品名とキャラ名は自動でタグになります" }
      - { name: tags, label: タグ（幼馴染・同居など・カンマ区切り・任意）, widget: list, required: false, hint: "作品名とキャラ名は自動でタグになるので、ここには入れなくてOK" }
      - { name: featured, label: おすすめに表示（一覧の上に固定で出ます）, widget: boolean, default: false, required: false }
      - { name: thumb, label: サムネ（顔のイラスト・正方形に自動で切り抜き）, widget: image, choose_url: false, required: false }
      - name: story
        label: ストーリーのURL（キャラぷ・あるときだけ）
        widget: string
        required: false
        pattern: ['^$|^https://([a-z0-9-]+\.)*kyarapu\.com/', "キャラぷのURL（https://〜kyarapu.com/〜）だけ入れられます"]
      - name: talk
        label: トークのURL（キャラぷ・あるときだけ）
        widget: string
        required: false
        pattern: ['^$|^https://([a-z0-9-]+\.)*kyarapu\.com/', "キャラぷのURL（https://〜kyarapu.com/〜）だけ入れられます"]
      - name: updates
        label: 更新履歴（スチル追加など。新しいものを上に）
        label_singular: 更新
        widget: list
        required: false
        add_to_top: true
        summary: "{{fields.date}}｜{{fields.text}}"
        fields:
          - { name: date, label: 日付, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
          - { name: text, label: 内容（例：スチル追加）, widget: string }
      - name: illust_tags
        label: イラスト用の別名（任意）
        widget: list
        required: false
        hint: "CREATIVE LOGの作品名がこの作品名と違うときだけ。キャラぷのURLか作品名が一致するイラストは自動で並びます"

  # ── サイト設定 ──
  - name: settings
    label: サイト設定
    editor: { preview: false }
    files:
      - name: categories
        label: 分類一覧
        file: content/categories.json
        format: json
        fields:
          - name: categories
            label: 分類（上から順にトップに並びます）
            label_singular: 分類
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 分類名, widget: string }
              - { name: sub, label: 日本語の小見出し（任意・段の見出しの横に小さく出ます）, widget: string, required: false }
              - { name: description, label: 説明（任意）, widget: string, required: false }
      - name: originals
        label: オリジナルの表紙
        file: content/originals.json
        format: json
        fields:
          - name: covers
            label: 表紙（CREATIVE LOGのORIGINALの段に出ます）
            label_singular: 表紙
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: キャラ名（名前のないオリジナルは「オリジナル」）, widget: string }
              - { name: image, label: 表紙の画像, widget: image, choose_url: false }
      - name: site
        label: サイト情報
        file: content/site.json
        format: json
        fields:
          - { name: description, label: サイトの説明（Xカードなどに出ます）, widget: string, required: false }
          - { name: goatcounter, label: GoatCounterのCode（アクセス解析）, widget: string, required: false, hint: "例：min-illust（https://min-illust.goatcounter.com の min-illust の部分）" }
          - { name: x_handle, label: XのID（@なし・任意）, widget: string, required: false, hint: "Xで共有したときに「@ID より」が付きます" }
