<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>透かしツール｜Min.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Courier+Prime:wght@700&display=swap">
<style>
/* 自分用ツール：画像に透かし（サイン）を入れて、小さくしてから保存する。画像は端末の中だけで処理し、どこにも送らない。 */
:root{--paper:#eeece6;--ink:#141312;--soft:#55524c;--line:#c9c5bb;--hot:#ff2e6e;--card:#fbfaf6;
  --f-display:"Dela Gothic One",sans-serif;--f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;--f-mono:"Courier Prime",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121110;--ink:#efece4;--soft:#a39f96;--line:#34312d;--hot:#ff4f86;--card:#1c1a18;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body)}
.wrap{max-width:980px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px))}
h1{font:400 clamp(28px,7vw,44px)/1 var(--f-display);margin:0}
h1 small{display:block;font:700 12px var(--f-mono);letter-spacing:.2em;margin-top:8px;color:var(--soft)}
.note{color:var(--soft);font-size:12px;margin:10px 0 0}
.grid{display:grid;gap:18px;margin-top:20px}
@media (min-width:820px){.grid{grid-template-columns:340px 1fr;align-items:start}}
.panel{background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px}
.drop{display:block;border:3px dashed var(--ink);padding:22px 12px;text-align:center;cursor:pointer;background:var(--card)}
.drop.over{background:var(--hot);color:#fff}
.drop b{font:400 18px var(--f-display);display:block}
.drop input{display:none}
label.row{display:block;margin-top:12px;font-weight:700;font-size:13px}
label.row span{float:right;font:700 12px var(--f-mono);color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--hot)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{font:700 12px var(--f-body);border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:5px 10px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.stage{background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;min-height:260px;padding:8px}
.stage canvas{max-width:100%;max-height:70vh;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.thumbs .moved{position:absolute;left:0;bottom:0;background:var(--hot);color:#fff;font:700 10px var(--f-body);padding:0 4px}
.stage p{color:var(--soft);font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:10px}
.thumbs button{position:relative;padding:0;border:2px solid var(--line);background:var(--line);aspect-ratio:1;cursor:pointer;overflow:hidden}
.thumbs button.on{border-color:var(--hot)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:0;right:0;background:var(--ink);color:var(--paper);font:700 11px var(--f-mono);padding:0 4px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{font:400 15px/1 var(--f-display);border:3px solid var(--ink);background:var(--card);color:var(--ink);padding:11px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn.hot{background:var(--hot);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.status{font:700 12px var(--f-mono);color:var(--soft);margin-top:8px;min-height:1.4em}
.meta{font:700 11px var(--f-mono);color:var(--soft);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>WATERMARK<small>透かしを入れて小さくしてから保存する（自分用）</small></h1>
  <p class="note">画像はこの端末の中だけで処理します。どこにも送られません。設定はこのブラウザが覚えます。</p>

  <div class="grid">
    <div class="panel">
      <label class="drop" id="drop"><b>画像を選ぶ</b>ここにドラッグ＆ドロップでもOK（何枚でも）<input id="file" type="file" accept="image/*" multiple></label>

      <label class="row">位置</label>
      <div class="seg" id="pos">
        <button data-v="br">右下</button><button data-v="bl">左下</button><button data-v="tr">右上</button><button data-v="tl">左上</button><button data-v="c">中央</button><button data-v="tile">全体にくり返し</button>
      </div>
      <label class="row">色</label>
      <div class="seg" id="color"><button data-v="auto">自動（背景に合わせる）</button><button data-v="white">白</button><button data-v="black">黒</button></div>

      <label class="row">濃さ <span id="opV"></span><input id="op" type="range" min="5" max="80" step="1"></label>
      <label class="row">大きさ（画像の幅に対して） <span id="szV"></span><input id="sz" type="range" min="8" max="60" step="1"></label>
      <label class="row">線の太さ <span id="bdV"></span><input id="bd" type="range" min="0" max="4" step="1"></label>
      <label class="row">端からの余白 <span id="mgV"></span><input id="mg" type="range" min="0" max="10" step="0.5"></label>

      <label class="row">長い辺の最大サイズ</label>
      <div class="seg" id="max"><button data-v="1200">1200px</button><button data-v="1600">1600px</button><button data-v="2000">2000px</button><button data-v="0">縮めない</button></div>
      <label class="row">保存する形式</label>
      <div class="seg" id="fmt"><button data-v="image/jpeg">JPEG</button><button data-v="image/webp">WebP（軽い）</button><button data-v="image/png">PNG</button></div>
      <label class="row">画質 <span id="qV"></span><input id="q" type="range" min="60" max="100" step="1"></label>
    </div>

    <div>
      <div class="stage" id="stage"><p>画像を選ぶと、ここにプレビューが出ます</p></div>
      <div class="meta" id="meta"></div>
      <p class="note" id="dragNote">プレビューのサインを指やマウスでドラッグすると、<b>その画像だけ</b>好きな場所に動かせます。</p>
      <div class="acts" style="margin-top:6px"><button class="btn" id="resetPos" disabled>この画像の位置を戻す</button><button class="btn" id="applyAll" disabled>この位置をほかの画像にも使う</button></div>
      <div class="thumbs" id="thumbs"></div>
      <div class="acts">
        <button class="btn hot" id="save" disabled>まとめて保存</button>
        <button class="btn" id="share" disabled hidden>写真・ファイルに保存（スマホ）</button>
        <button class="btn" id="clear" disabled>選んだ画像をクリア</button>
      </div>
      <div class="status" id="status"></div>
      <p class="note">保存した画像を、管理画面（/admin2/）の「メディア」からまとめてアップロードしてください。</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DEF = { pos: "br", color: "auto", op: 22, sz: 24, bd: 1, mg: 3, max: 2000, fmt: "image/jpeg", q: 92 };
  let S = { ...DEF };
  try { S = { ...DEF, ...JSON.parse(localStorage.getItem("wm-settings") || "{}") }; } catch (e) {}
  const saveS = () => { try { localStorage.setItem("wm-settings", JSON.stringify(S)); } catch (e) {} };

  // ---- サイン（透明PNG） ----
  const logo = new Image();
  logo.src = "sign.png";
  const tinted = {};
  function tint(color) { // 色をつけたサイン（キャッシュ）
    if (tinted[color]) return tinted[color];
    const c = document.createElement("canvas"); c.width = logo.naturalWidth; c.height = logo.naturalHeight;
    const x = c.getContext("2d"); x.drawImage(logo, 0, 0);
    x.globalCompositeOperation = "source-in"; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
    return (tinted[color] = c);
  }

  // ---- 画像の読み込み ----
  const items = []; // { file, bmp, name }
  let cur = 0;
  async function load(file) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) {
      return await new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = URL.createObjectURL(file); });
    }
  }
  async function addFiles(list) {
    const fs = [...list].filter((f) => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
    $("status").textContent = `${fs.length} 枚を読み込み中…`;
    for (const f of fs) {
      try { const bmp = await load(f); items.push({ file: f, bmp, name: f.name.replace(/\.[^.]+$/, "") }); }
      catch (e) { $("status").textContent = `読み込めない画像がありました：${f.name}`; }
    }
    if (fs.length) $("status").textContent = "";
    if (cur >= items.length) cur = 0;
    renderThumbs(); preview();
  }

  // ---- 透かしを入れる ----
  function luminance(ctx, x, y, w, h) {
    try {
      const d = ctx.getImageData(Math.max(0, x | 0), Math.max(0, y | 0), Math.max(1, w | 0), Math.max(1, h | 0)).data;
      let s = 0, n = 0; for (let i = 0; i < d.length; i += 16) { s += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
      return n ? s / n : 128;
    } catch (e) { return 128; }
  }
  function stamp(ctx, img, x, y, w, h, bold) {
    const r = bold * Math.max(1, w / 400);
    if (!r) { ctx.drawImage(img, x, y, w, h); return; }
    for (let a = 0; a < 8; a++) ctx.drawImage(img, x + Math.cos(a * Math.PI / 4) * r, y + Math.sin(a * Math.PI / 4) * r, w, h);
    ctx.drawImage(img, x, y, w, h);
  }
  let lastBox = null; // プレビューでのサインの位置（ドラッグ判定用）
  function render(bmp, it, previewMax) {
    const sw = bmp.width, sh = bmp.height;
    const lim = previewMax ? Math.min(previewMax, S.max || Infinity) : S.max;
    const k = lim && Math.max(sw, sh) > lim ? lim / Math.max(sw, sh) : 1;
    const W = Math.round(sw * k), H = Math.round(sh * k);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    if (S.fmt === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); } // 透明部分は白に
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, 0, 0, W, H);
    if (!logo.complete || !logo.naturalWidth) return c;
    const ratio = logo.naturalHeight / logo.naturalWidth;
    const m = Math.min(W, H) * S.mg / 100;
    ctx.save(); ctx.globalAlpha = S.op / 100;
    if (S.pos === "tile") {
      const lw = W * S.sz / 100 * 0.7, lh = lw * ratio;
      const col = S.color === "auto" ? (luminance(ctx, 0, 0, W, H) < 140 ? "#fff" : "#000") : S.color === "white" ? "#fff" : "#000";
      const img = tint(col);
      ctx.translate(W / 2, H / 2); ctx.rotate(-20 * Math.PI / 180);
      const span = Math.hypot(W, H), gx = lw * 1.6, gy = lh * 2.4;
      for (let yy = -span / 2, row = 0; yy < span / 2; yy += gy, row++)
        for (let xx = -span / 2 + (row % 2 ? gx / 2 : 0); xx < span / 2; xx += gx) stamp(ctx, img, xx, yy, lw, lh, S.bd);
    } else {
      const lw = W * S.sz / 100, lh = lw * ratio;
      let x = W - lw - m, y = H - lh - m;
      if (S.pos === "bl") x = m;
      if (S.pos === "tl") { x = m; y = m; }
      if (S.pos === "tr") y = m;
      if (S.pos === "c") { x = (W - lw) / 2; y = (H - lh) / 2; }
      if (it && it.at) { x = it.at.x * W - lw / 2; y = it.at.y * H - lh / 2; } // 自分で動かした位置
      x = Math.min(Math.max(x, 0), W - lw); y = Math.min(Math.max(y, 0), H - lh);
      lastBox = { x: x / W, y: y / H, w: lw / W, h: lh / H };
      const col = S.color === "auto" ? (luminance(ctx, x, y, lw, lh) < 140 ? "#fff" : "#000") : S.color === "white" ? "#fff" : "#000";
      stamp(ctx, tint(col), x, y, lw, lh, S.bd);
    }
    ctx.restore();
    return c;
  }
  const extOf = (t) => (t === "image/webp" ? "webp" : t === "image/png" ? "png" : "jpg");
  function toBlob(c) {
    return new Promise((ok) => c.toBlob((b) => {
      if (b && b.type === S.fmt) return ok(b);
      c.toBlob((j) => ok(j), "image/jpeg", S.q / 100); // WebP非対応の端末はJPEGで
    }, S.fmt, S.q / 100));
  }

  // ---- 画面 ----
  function renderThumbs() {
    $("thumbs").innerHTML = items.map((it, i) => `<button class="${i === cur ? "on" : ""}" data-i="${i}" aria-label="${i + 1}枚目"><img src="${it.url ||= URL.createObjectURL(it.file)}" alt=""><span class="x" data-del="${i}">✕</span>${it.at ? `<span class="moved">位置</span>` : ""}</button>`).join("");
    const has = items.length > 0;
    $("save").disabled = $("clear").disabled = !has;
    $("share").disabled = !has;
    $("save").textContent = items.length > 1 ? `まとめて保存（${items.length}枚・ZIP）` : "保存";
  }
  function preview() {
    const it = items[cur];
    if (!it) { $("stage").innerHTML = "<p>画像を選ぶと、ここにプレビューが出ます</p>"; $("meta").textContent = ""; return; }
    const c = render(it.bmp, it, 1000);
    $("stage").innerHTML = ""; $("stage").appendChild(c);
    bindDrag(c, it);
    $("resetPos").disabled = !it.at; $("applyAll").disabled = !it.at || items.length < 2 || S.pos === "tile";
    $("dragNote").style.display = S.pos === "tile" ? "none" : "";
    $("meta").textContent = `${it.file.name} → ${c.width}×${c.height}px（${extOf(S.fmt).toUpperCase()}）`;
  }
  // プレビュー上でサインをドラッグして動かす（くり返しのときは使わない）
  function bindDrag(c, it) {
    let drag = null;
    const pt = (e) => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
    c.addEventListener("pointerdown", (e) => {
      if (S.pos === "tile" || !lastBox) return;
      const p = pt(e), b = lastBox;
      const inside = p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
      // サインの上をつかんだらその場所から、外をタップしたらそこへ移動
      drag = inside ? { dx: p.x - (b.x + b.w / 2), dy: p.y - (b.y + b.h / 2) } : { dx: 0, dy: 0 };
      it.at = { x: p.x - drag.dx, y: p.y - drag.dy };
      c.setPointerCapture(e.pointerId); redraw(c, it);
    });
    c.addEventListener("pointermove", (e) => { if (!drag) return; const p = pt(e); it.at = { x: p.x - drag.dx, y: p.y - drag.dy }; redraw(c, it); });
    const end = () => { if (!drag) return; drag = null; renderThumbs(); preview(); };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  }
  let raf = 0;
  function redraw(c, it) {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { const n = render(it.bmp, it, 1000), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height); x.drawImage(n, 0, 0); });
  }
  $("resetPos").addEventListener("click", () => { const it = items[cur]; if (it) { delete it.at; renderThumbs(); preview(); } });
  $("applyAll").addEventListener("click", () => { const it = items[cur]; if (!it || !it.at) return; items.forEach((x) => { x.at = { ...it.at }; }); renderThumbs(); preview(); $("status").textContent = "全部の画像に同じ位置を使います"; });
  function syncUI() {
    for (const id of ["pos", "color", "max", "fmt"]) document.querySelectorAll(`#${id} [data-v]`).forEach((b) => b.classList.toggle("on", String(S[id]) === b.dataset.v));
    for (const [id, unit] of [["op", "%"], ["sz", "%"], ["bd", ""], ["mg", "%"], ["q", ""]]) { $(id).value = S[id]; $(id + "V").textContent = S[id] + unit; }
    $("q").disabled = S.fmt === "image/png";
  }
  for (const id of ["pos", "color", "max", "fmt"]) $(id).addEventListener("click", (e) => {
    const b = e.target.closest("[data-v]"); if (!b) return;
    S[id] = id === "max" ? +b.dataset.v : b.dataset.v; saveS(); syncUI(); preview();
  });
  for (const id of ["op", "sz", "bd", "mg", "q"]) $(id).addEventListener("input", () => { S[id] = +$(id).value; saveS(); syncUI(); preview(); });
  $("thumbs").addEventListener("click", (e) => {
    const d = e.target.closest("[data-del]");
    if (d) { items.splice(+d.dataset.del, 1); if (cur >= items.length) cur = Math.max(0, items.length - 1); renderThumbs(); preview(); return; }
    const b = e.target.closest("[data-i]"); if (b) { cur = +b.dataset.i; renderThumbs(); preview(); }
  });
  $("file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
  $("clear").addEventListener("click", () => { items.length = 0; cur = 0; renderThumbs(); preview(); });

  async function buildFiles() {
    const out = [];
    for (let i = 0; i < items.length; i++) {
      $("status").textContent = `透かしを入れています… ${i + 1} / ${items.length}`;
      const b = await toBlob(render(items[i].bmp, items[i]));
      out.push(new File([b], `${items[i].name}.${extOf(b.type)}`, { type: b.type }));
    }
    return out;
  }
  function download(blob, name) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  $("save").addEventListener("click", async () => {
    const files = await buildFiles();
    if (files.length === 1) download(files[0], files[0].name);
    else if (window.JSZip) {
      const zip = new JSZip(); files.forEach((f) => zip.file(f.name, f));
      $("status").textContent = "ZIPにまとめています…";
      const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
      download(await zip.generateAsync({ type: "blob" }), `min-watermark-${stamp}.zip`);
    } else files.forEach((f, i) => setTimeout(() => download(f, f.name), i * 400));
    $("status").textContent = `${files.length} 枚を保存しました`;
  });
  // スマホ：共有メニューから「画像を保存」や「ファイルに保存」
  if (navigator.canShare && navigator.canShare({ files: [new File([""], "a.jpg", { type: "image/jpeg" })] })) {
    $("share").hidden = false;
    $("share").addEventListener("click", async () => {
      const files = await buildFiles();
      try { await navigator.share({ files }); $("status").textContent = `${files.length} 枚を共有メニューに渡しました`; }
      catch (e) { $("status").textContent = "共有をキャンセルしました"; }
    });
  }
  logo.onload = () => preview();
  syncUI(); renderThumbs();
})();
</script>
<!-- ホーム画面から開いたとき（アドレスバーがない）だけ出る更新ボタン -->
<button id="hsReload" type="button" aria-label="最新に更新" style="display:none;position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;font:700 13px system-ui,sans-serif;background:#141312;color:#fff;border:2px solid #fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.35)">↻ 更新</button>
<script>
(function(){
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var b = document.getElementById("hsReload"); if (!standalone || !b) return;
  b.style.display = "block";
  b.onclick = function(){
    try {
      var u = new URL(location.href); u.searchParams.set("r", Date.now().toString(36)); // 古いページを使わずに読み直す
      location.replace(u.toString());
    } catch (e) { location.reload(); }
  };
})();
</script>
</body>
</html>
