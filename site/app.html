<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noai, noimageai">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a photocopied gig-flyer wall — one ink rule down the left, each work pasted on as a taped flyer, dated like a show stub. */
:root{
  --paper:#eeece6; --ink:#141312; --ink-soft:#55524c; --line:#c9c5bb;
  --hot:#ff2e6e; --tape:#f4e04d; --card:#fbfaf6; --on-hot:#fff;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121110; --ink:#efece4; --ink-soft:#a39f96; --line:#34312d;
  --hot:#ff4f86; --tape:#d9c53c; --card:#1c1a18; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.2px);background-size:5px 5px}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}

/* 保存しにくくする */
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.shot img,.tile img,.lb img,.cover img,.nw img,.rc img{pointer-events:none}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:4px solid var(--ink);padding-bottom:14px}
.mast a{text-decoration:none}
.mast h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,10vw,84px);line-height:.9;margin:0;letter-spacing:-.01em}
.mast h1 .dot{color:var(--hot)}
.mast h1 small{display:block;font-size:.34em;letter-spacing:.32em;margin-top:.5em;font-family:var(--f-mono);font-weight:700}
.meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-size:22px;font-family:var(--f-display);font-weight:400;letter-spacing:0;display:block}

.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:16px;font:700 13px var(--f-mono);letter-spacing:.04em}
.crumbs a{text-decoration:none;border-bottom:2px solid var(--hot)}
.crumbs span[aria-hidden]{color:var(--ink-soft)}

.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,6vw,34px);margin:0;line-height:1.1;text-wrap:balance}
.sec-h em{font:700 12px var(--f-mono);font-style:normal;letter-spacing:.12em;color:var(--ink-soft)}
.sec-h .lead{flex-basis:100%;margin:2px 0 0;color:var(--ink-soft)}
.label{display:inline-block;background:var(--ink);color:var(--paper);font:400 13px var(--f-display);padding:2px 10px 3px;transform:rotate(-2deg)}

/* tiles (categories / tags) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .12s}
.tile:hover{transform:translate(-2px,-2px)}
.tile:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.cover{aspect-ratio:1/1;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--ink)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{font-family:var(--f-display);font-size:42px;color:var(--ink-soft)}
.tile b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3;padding:8px 10px 0;overflow-wrap:anywhere}
.tile small{font:700 12px var(--f-mono);color:var(--ink-soft);padding:2px 10px 10px;letter-spacing:.06em}
.tiles.big{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tiles.big .tile b{font-size:22px}

/* timeline */
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:9px;top:0;bottom:0;border-left:3px dashed var(--ink)}
.month{position:relative;margin:30px 0 14px -34px;display:flex;align-items:center;gap:12px}
.month span{font-family:var(--f-display);font-size:24px;background:var(--ink);color:var(--paper);padding:2px 12px 4px;transform:rotate(-2deg)}
.month em{font:700 12px var(--f-mono);font-style:normal;letter-spacing:.12em;color:var(--ink-soft)}
.post{position:relative;margin-bottom:44px}
.post::before{content:"";position:absolute;left:-31px;top:6px;width:14px;height:14px;background:var(--hot);border:3px solid var(--ink);border-radius:50%}
.stub{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;font:700 13px var(--f-mono);letter-spacing:.1em;margin-bottom:20px;font-variant-numeric:tabular-nums}
.stub .d{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:0}
.stub .no{color:var(--ink-soft)}
.pics{background:var(--ink);color:var(--paper);padding:1px 6px}
.flyer{position:relative;background:var(--card);border:2px solid var(--ink);padding:12px 12px 16px;box-shadow:6px 6px 0 color-mix(in srgb,var(--ink) 85%,transparent);max-width:640px}
.post:nth-of-type(odd) .flyer{transform:rotate(-.6deg)}
.post:nth-of-type(even) .flyer{transform:rotate(.7deg)}
.flyer::before,.flyer::after{content:"";position:absolute;top:-12px;width:78px;height:22px;background:color-mix(in srgb,var(--tape) 80%,transparent)}
.flyer::before{left:14px;transform:rotate(-7deg)}
.flyer::after{right:14px;transform:rotate(6deg)}
.flyer h3{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,4.6vw,28px);line-height:1.25;margin:14px 0 4px;text-wrap:balance}
.flyer h3 a{text-decoration:none}
.flyer h3 a:hover{color:var(--hot)}
.flyer p{margin:6px 0 0;white-space:pre-wrap;max-width:62ch;overflow-wrap:anywhere}
.flyer p.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font:700 11px var(--f-mono);letter-spacing:.06em;background:var(--hot);color:var(--on-hot);padding:3px 7px;text-decoration:none}
.tag.cat{background:var(--ink);color:var(--paper)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;font:400 14px/1 var(--f-display);border:3px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.btn.hot{background:var(--hot);color:var(--on-hot)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.shot:focus-visible,.play:focus-visible,.tag:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

/* images */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.shots.n1{grid-template-columns:1fr}
.shot{display:block;width:100%;padding:0;border:0;background:var(--line);cursor:zoom-in;overflow:hidden;position:relative}
.shot img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:var(--paper)}
.shots.multi .shot{aspect-ratio:1/1}
.shots.multi .shot img{height:100%;max-height:none;object-fit:cover}
.shots.multi.odd .shot:first-child{grid-column:1/-1;aspect-ratio:4/3}
.more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,9,8,.6);color:#fff;font-family:var(--f-display);font-size:28px}
.stack{display:grid;gap:10px}
.stack .shot img{max-height:none}

/* media */
.media{display:grid;gap:10px;margin-top:12px}
.play{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px;cursor:pointer;font:700 14px var(--f-body)}
.play .ic{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--hot);color:var(--on-hot);font-size:18px}
.play .yt{flex:none;width:96px;aspect-ratio:16/9;object-fit:cover;pointer-events:none}
.play small{display:block;font:700 11px var(--f-mono);letter-spacing:.08em;color:var(--ink-soft)}
.frame{position:relative;width:100%;aspect-ratio:16/9;border:2px solid var(--ink);background:#000}
.frame.v{aspect-ratio:9/16;max-width:360px}
.frame.suno{aspect-ratio:auto;height:260px;background:var(--paper)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ext{font:700 12px var(--f-mono);letter-spacing:.04em}

.morebtn{display:block;margin:8px auto 0}
.empty{border:3px dashed var(--ink);padding:32px 20px;text-align:center;background:var(--card)}
.empty strong{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,6vw,40px);line-height:1.1}
.empty p{color:var(--ink-soft);margin:12px auto 0;max-width:40ch}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}
.foot{margin-top:48px;font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--ink-soft);border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.foot .no-ai{letter-spacing:.04em;font-family:var(--f-body)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,9,8,.94);display:flex;align-items:center;justify-content:center;padding:24px 16px 80px;z-index:50;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb-bar{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:14px;color:#fff;font:700 14px var(--f-mono)}
.lb-btn{background:#fff;color:#141312;border:0;font:400 20px/1 var(--f-display);width:44px;height:44px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font:700 13px var(--f-mono);padding:10px 16px;z-index:60}

/* 新着（小さく横に並べる） */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.rstrip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none;align-items:flex-start}
.rstrip::-webkit-scrollbar{display:none}
.rc{flex:none;scroll-snap-align:start;padding:0;border:2px solid var(--ink);background:var(--card);color:var(--ink);text-align:left;cursor:zoom-in;font:inherit;box-shadow:4px 4px 0 var(--ink);max-width:78vw}
.rc .im{display:block;height:min(300px,58vw);overflow:hidden;background:var(--line);position:relative}
.rc img{height:100%;width:100%;object-fit:cover;display:block}
.rc .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,9,8,.55);color:#fff;font:400 26px var(--f-display)}
.rc .t{display:block;padding:6px 8px 7px;width:0;min-width:100%;box-sizing:border-box}
.rc b{display:block;font:700 12px/1.35 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc small{display:block;font:700 10px var(--f-mono);color:var(--ink-soft);letter-spacing:.04em}
.rc.end{display:flex;align-items:center;justify-content:center;text-decoration:none;font:400 15px/1.4 var(--f-display);padding:0 18px;cursor:pointer;height:calc(min(300px,58vw) + 4px);text-align:center}
.nw{flex:0 0 104px;scroll-snap-align:start;padding:0;border:2px solid var(--ink);background:var(--card);color:var(--ink);text-align:left;cursor:zoom-in;font:inherit;box-shadow:3px 3px 0 var(--ink)}
.nw .im{display:block;aspect-ratio:1/1;overflow:hidden;background:var(--line);position:relative}
.nw img{width:100%;height:100%;object-fit:cover;display:block}
.nw .n{position:absolute;right:3px;bottom:3px;background:var(--ink);color:var(--paper);font:700 10px var(--f-mono);padding:0 4px}
.nw b{display:block;font:700 11px/1.3 var(--f-body);padding:5px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw small{display:block;font:700 10px var(--f-mono);color:var(--ink-soft);padding:0 6px 5px;letter-spacing:.04em}

/* 分類の切り替え */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{font:700 12px var(--f-body);text-decoration:none;border:2px solid var(--ink);padding:3px 11px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--paper)}

/* 作品ごとのまとめ */
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
@media (min-width:600px){.groups{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px}}
.gcard{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);position:relative;transition:transform .12s}
.gcard:hover{transform:translate(-2px,-2px)}
.gcard:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.gcard .new{position:absolute;top:-8px;left:-6px;background:var(--hot);color:var(--on-hot);font:400 11px var(--f-display);padding:1px 6px;transform:rotate(-4deg);z-index:1}
.gcard .new.up{background:var(--tape);color:#141312}
.gcard b{font:700 12.5px/1.35 var(--f-body);padding:6px 7px 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard small{font:700 10px var(--f-mono);color:var(--ink-soft);padding:2px 7px 7px;letter-spacing:.02em}
.gcard{box-shadow:3px 3px 0 var(--ink)}

/* 作品ページ・一覧の投稿（コンパクト） */
.gh{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:end;margin-top:20px}
.gh .cover{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--hot)}
.gh h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,6vw,32px);line-height:1.2;margin:0;overflow-wrap:anywhere}
.gh p{margin:4px 0 0;font:700 12px var(--f-mono);color:var(--ink-soft);letter-spacing:.04em}
.entry{border-top:2px dashed var(--line);padding-top:14px;margin-top:16px}
.entry .stub{margin-bottom:8px}
.entry .stub .d{font-size:17px}
.entry h3{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3;margin:0 0 4px}
.entry h3 a{text-decoration:none}
.entry p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:600px){.grid3{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid3 .shot{aspect-ratio:1/1;border:2px solid var(--ink)}
.grid3 .shot img{height:100%;max-height:none;object-fit:cover}
.cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,9,8,.75));color:#fff;font:700 10px/1.3 var(--f-body);padding:12px 5px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.solo1{max-width:520px}
.solo1 .shot{border:2px solid var(--ink)}
.solo1 .shot img{max-height:70vh;width:100%;object-fit:contain}
.lb-cap{position:absolute;left:16px;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font:700 14px/1.4 var(--f-body);pointer-events:none}
.lb-cap small{display:block;font:700 11px var(--f-mono);color:#aaa;letter-spacing:.06em;margin-top:2px}
.lb{padding-bottom:120px}

@media (prefers-reduced-motion: reduce){.post .flyer{transform:none!important}.tile{transition:none}}
@media (max-width:480px){.tl{padding-left:26px}.tl::before{left:5px}.post::before{left:-27px}.month{margin-left:-26px}.meta{text-align:left}.tiles{grid-template-columns:1fr 1fr}.tiles.big{grid-template-columns:1fr 1fr}}
</style>
<!--BOOT-->
</head>
<body>
<div class="wrap">
  <header class="mast">
    <a href="__BASE__/"><h1>Min<span class="dot">.</span><small>ILLUST LOG</small></h1></a>
    <div class="meta"><b id="count">—</b>WORKS POSTED<br><span id="range"></span></div>
  </header>
  <main id="app" aria-live="polite"><p style="margin-top:32px;font-family:var(--f-mono)">LOADING…</p></main>
  <footer class="foot">
    <span>© Min. — all works by the artist</span>
    <span class="no-ai">掲載作品の無断転載・AI学習への利用を禁止します。</span>
  </footer>
</div>
<div class="lb" id="lb" hidden><img id="lbImg" alt=""><div class="lb-cap" id="lbCap"></div><div class="lb-bar" id="lbBar" hidden><button class="lb-btn" id="lbPrev" aria-label="前の画像">‹</button><span id="lbCount"></span><button class="lb-btn" id="lbNext" aria-label="次の画像">›</button></div></div>

<script>
(() => {
  const B = window.__BOOT || { base: "", site: location.origin, post: null };
  const $ = (s) => document.getElementById(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const WD = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  const PAGE = 24;
  let D = { posts: [], categories: [] };
  let lbList = [], lbIdx = 0, shown = PAGE;

  // ---- links ----
  const enc = encodeURIComponent;
  const catHref = (c) => `${B.base}/#/c/${enc(c)}`;
  const tagHref = (c, t) => `${B.base}/#/c/${enc(c)}/t/${enc(t)}`;
  const allHref = `${B.base}/#/all`;

  // ---- analytics ----
  function track(p){
    let n = 0;
    (function go(){
      if (window.goatcounter && window.goatcounter.count){ window.goatcounter.count({ path: p }); return; }
      if (++n < 20) setTimeout(go, 500);
    })();
  }

  // ---- pieces ----
  const NEW_N = 12, GROUP_PAGE = 24, NEW_DAYS = 7;
  const md = (d) => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}`; };
  const recent = (d) => (Date.now() - new Date(d + "T00:00:00")) / 86400000 <= NEW_DAYS;
  const groupHref = (key) => `${B.base}/#/g/${enc(key)}`;
  const groupOf = (p) => (D.groups || []).find(g => g.key === p.group);
  // 拡大表示用の画像リスト（一言・名前・日付つき）
  const lbItems = (p) => p.images.map(im => ({ src: im.src, caption: im.caption || "", label: p.label, date: p.date }));
  function shot(key, k, im, cls){
    return `<button class="shot${cls ? " " + cls : ""}" data-lb="${key}" data-i="${k}" aria-label="${esc(im.caption || im.label)}を拡大"><img src="${esc(im.thumb || im.src)}" alt="${esc(im.caption || im.label)}" loading="lazy">${im.caption ? `<span class="cap">${esc(im.caption)}</span>` : ""}</button>`;
  }
  function mediaHTML(p){
    if (!p.media.length) return "";
    return `<div class="media">` + p.media.map((m) => {
      if (m.type === "youtube") return `<button class="play" data-embed="https://www.youtube-nocookie.com/embed/${esc(m.id)}?autoplay=1&rel=0" data-kind="${m.vertical ? "v" : "yt"}"><img class="yt" src="${esc(m.thumb)}" alt="" loading="lazy"><span>▶ 動画を再生<small>YOUTUBE</small></span></button>`;
      if (m.type === "suno" && m.id) return `<button class="play" data-embed="https://suno.com/embed/${esc(m.id)}" data-kind="suno"><span class="ic">♪</span><span>曲を再生<small>SUNO</small></span></button><a class="ext" href="${esc(m.url)}" target="_blank" rel="noopener">Sunoで開く ↗</a>`;
      if (m.type === "suno") return `<a class="play" href="${esc(m.url)}" target="_blank" rel="noopener"><span class="ic">♪</span><span>Sunoで曲を聴く ↗<small>SUNO</small></span></a>`;
      return `<a class="play" href="${esc(m.url)}" target="_blank" rel="noopener"><span class="ic">↗</span><span>リンクを開く<small>${esc(new URL(m.url).hostname)}</small></span></a>`;
    }).join("") + `</div>`;
  }
  function tagsHTML(p){
    return `<div class="tags"><a class="tag cat" href="${catHref(p.category)}">${esc(p.category)}</a>` +
      p.tags.map(t => `<a class="tag" href="${tagHref(p.category, t)}">#${esc(t)}</a>`).join("") + `</div>`;
  }
  function stubHTML(p){
    const [y, m, d] = p.date.split("-");
    const wd = WD[new Date(+y, m - 1, +d).getDay()];
    return `<div class="stub"><span class="d">${y}.${m}.${d}</span><span>${wd}</span>${p.images.length > 1 ? `<span class="pics">${p.images.length} PICS</span>` : ""}</div>`;
  }
  const empty = (msg) => `<div class="empty"><strong>NO WORKS YET</strong><p>${msg}</p></div>`;
  // 投稿1件（小さいサムネのグリッド。タップで大きく表示）
  function entry(p, key, offset, opts = {}){
    const items = p.images.map(im => ({ ...im, label: p.label }));
    return `<article class="entry">${stubHTML(p)}
      ${opts.group ? `<h3><a href="${groupHref(p.group)}">${esc((groupOf(p) || {}).name || p.label)}</a></h3>` : ""}
      ${p.comment ? `<p>${esc(p.comment)}</p>` : ""}
      ${items.length ? `<div class="grid3">${items.map((im, k) => shot(key, offset + k, im)).join("")}</div>` : ""}
      ${mediaHTML(p)}
      ${opts.tags ? tagsHTML(p) : ""}
    </article>`;
  }
  // 投稿の並び（拡大表示は並び全体で左右に送れる）
  function entries(list, key, opts){
    lists[key] = list.flatMap(lbItems);
    let off = 0;
    return list.map(p => { const h = entry(p, key, off, opts); off += p.images.length; return h; }).join("");
  }
  function groupCard(g){
    const badge = recent(g.first) ? `<span class="new">NEW</span>` : recent(g.updated) ? `<span class="new up">UP</span>` : "";
    return `<a class="gcard" href="${groupHref(g.key)}">${badge}<span class="cover">${g.cover ? `<img src="${esc(g.cover)}" alt="" loading="lazy">` : `<span class="ph">♪</span>`}</span><b>${esc(g.name)}</b><small>${g.pics ? g.pics + "枚 · " : ""}${md(g.updated)}</small></a>`;
  }
  const coverOf = (p) => (p.images[0] && p.images[0].thumb) || (p.media.find(m => m.thumb) || {}).thumb || "";
  const crumbs = (items) => `<nav class="crumbs" aria-label="現在地"><a href="${B.base}/">TOP</a>` +
    items.map(([label, href]) => `<span aria-hidden="true">›</span>` + (href ? `<a href="${href}">${esc(label)}</a>` : `<span>${esc(label)}</span>`)).join("") + `</nav>`;

  // ---- views ----
  let lists = {};
  function viewTop(cat){
    lists = {};
    // 新着：最近の画像を1枚ずつ。1つの投稿からは最大2枚（表紙→次の1枚）
    const items = [];
    D.posts.forEach((p, i) => {
      if (items.length >= NEW_N || !p.images.length) return;
      lists["n" + i] = lbItems(p);
      const order = [p.coverIdx || 0, ...p.images.map((_, k) => k).filter(k => k !== (p.coverIdx || 0))].slice(0, 2);
      order.forEach((k, j) => { if (items.length < NEW_N) items.push({ p, i, k, more: j === 1 && p.images.length > 2 ? p.images.length - 2 : 0 }); });
    });
    const gname = (p) => (groupOf(p) || {}).name || p.label;
    const strip = items.map(({ p, i, k, more }) => { const im = p.images[k];
      const ratio = im.w && im.h ? Math.min(Math.max(im.w / im.h, 0.56), 1.6) : 0.75;
      return `<button class="rc" data-lb="n${i}" data-i="${k}" aria-label="${esc(im.caption || p.label)}を拡大"><span class="im" style="aspect-ratio:${ratio.toFixed(3)}"><img src="${esc(im.thumb)}" alt="" loading="lazy">${more ? `<span class="n">+${more}</span>` : ""}</span><span class="t"><b>${esc(im.caption || gname(p))}</b><small>${md(p.date)}${im.caption ? " · " + esc(gname(p)) : ""}</small></span></button>`; }).join("")
      + (items.length ? `<a class="rc end" href="${allHref}">すべての<br>投稿を見る →</a>` : "");
    const cats = D.categories.filter(c => c.count > 0);
    const gs = (D.groups || []).filter(g => !cat || g.cats.includes(cat));
    const part = gs.slice(0, shown);
    return `${items.length ? `<section class="sec"><div class="sec-h"><span class="label">NEW</span><h2>新着</h2><em>← SWIPE</em></div><div class="rstrip">${strip}</div></section>` : ""}
      <section class="sec" style="margin-top:28px"><div class="sec-h"><span class="label">WORKS</span><h2>作品ごとに見る</h2><em>${gs.length} WORKS · 更新順</em></div>
      ${cats.length > 1 ? `<nav class="chips" aria-label="分類"><a class="chip${cat ? "" : " on"}" href="${B.base}/#/">すべて</a>${cats.map(c => `<a class="chip${c.name === cat ? " on" : ""}" href="${catHref(c.name)}">${esc(c.name)}</a>`).join("")}</nav>` : ""}
      ${part.length ? `<div class="groups">${part.map(groupCard).join("")}</div>` : empty("まだ作品がありません。")}
      ${shown < gs.length ? `<button class="btn morebtn" data-more style="margin-top:20px">もっと見る</button>` : ""}
      <p style="margin-top:22px"><a class="ext" href="${allHref}">すべての投稿を日付順で見る →</a></p></section>`;
  }
  function viewGroup(key){
    const g = (D.groups || []).find(x => x.key === key);
    if (!g) return `<div class="empty" style="margin-top:32px"><strong>NOT FOUND</strong><p>この作品は見つかりませんでした。</p><p><a class="btn" href="${B.base}/">トップへ</a></p></div>`;
    lists = {};
    const ps = g.posts.map(s => D.posts.find(p => p.slug === s)).filter(Boolean);
    document.title = `${g.name}｜Min. ILLUST LOG`;
    return crumbs([[g.name]]) + `<section class="gh"><span class="cover">${g.cover ? `<img src="${esc(g.cover)}" alt="">` : `<span class="ph">♪</span>`}</span>
      <div><h2>${esc(g.name)}</h2><p>${g.pics} PICS · ${ps.length} POSTS · ${g.updated.replaceAll("-", ".")} UPDATE</p></div></section>
      ${g.charapu ? `<div class="acts"><a class="btn hot" href="${esc(g.charapu)}" target="_blank" rel="noopener">このキャラと話す ↗</a></div>` : ""}
      <section class="sec" style="margin-top:20px">${entries(ps, "g", { tags: false })}</section>`;
  }
  function viewAll(){
    lists = {};
    return crumbs([["すべての投稿"]]) + `<section class="sec"><div class="sec-h"><h2>すべての投稿</h2><em>${D.posts.length} POSTS · 日付順</em></div>
      ${D.posts.length ? entries(D.posts.slice(0, shown), "all", { group: true, title: false }) : empty("まだ作品がありません。")}${shown < D.posts.length ? `<button class="btn morebtn" data-more style="margin-top:20px">もっと見る</button>` : ""}</section>`;
  }
  function viewTag(cat, tag){
    lists = {};
    const ps = D.posts.filter(p => p.category === cat && p.tags.includes(tag));
    return crumbs([[cat, catHref(cat)], ["#" + tag]]) + `<section class="sec"><div class="sec-h"><h2>#${esc(tag)}</h2><em>${esc(cat)} · ${ps.length} POSTS</em></div>
      ${ps.length ? entries(ps.slice(0, shown), "tag", { group: true, title: false }) : empty("このタグの作品はありません。")}${shown < ps.length ? `<button class="btn morebtn" data-more style="margin-top:20px">もっと見る</button>` : ""}</section>`;
  }
  function viewPost(slug){
    const p = D.posts.find(x => x.slug === slug);
    if (!p) return `<div class="empty" style="margin-top:32px"><strong>NOT FOUND</strong><p>この作品は見つかりませんでした。</p><p><a class="btn" href="${B.base}/">トップへ</a></p></div>`;
    lists = { post: lbItems(p) };
    const g = groupOf(p);
    const i = D.posts.indexOf(p), newer = D.posts[i - 1], older = D.posts[i + 1];
    const share = `${B.site}/w/${p.slug}/`;
    const xText = `${p.label}｜Min. ILLUST LOG` + (B.x ? ` @${B.x}` : "");
    document.title = `${p.label}｜Min. ILLUST LOG`;
    const items = p.images.map(im => ({ ...im, label: p.label }));
    const pics = items.length === 1 ? `<div class="solo1">${shot("post", 0, { ...items[0], thumb: items[0].src })}</div>`
      : items.length ? `<div class="grid3">${items.map((im, k) => shot("post", k, im)).join("")}</div>` : "";
    return crumbs(g ? [[g.name, groupHref(g.key)], [p.date.replaceAll("-", ".")]] : [[p.label]]) + `<article class="sec" style="margin-top:20px">
      ${stubHTML(p)}
      <h3 style="font-family:var(--f-display);font-weight:400;font-size:clamp(22px,6vw,30px);line-height:1.25;margin:0 0 8px">${esc(p.label)}</h3>
      ${p.comment ? `<p style="white-space:pre-wrap;margin:0 0 10px">${esc(p.comment)}</p>` : ""}
      ${pics}${mediaHTML(p)}${tagsHTML(p)}
      <div class="acts">
        ${p.charapu ? `<a class="btn hot" href="${esc(p.charapu)}" target="_blank" rel="noopener">このキャラと話す ↗</a>` : ""}
        <a class="btn" href="https://x.com/intent/post?text=${enc(xText)}&url=${enc(share)}" target="_blank" rel="noopener">Xで共有</a>
        <button class="btn" data-copy="${esc(share)}">リンクをコピー</button>
      </div>
      ${g && g.posts.length > 1 ? `<p style="margin-top:18px"><a class="btn" href="${groupHref(g.key)}">「${esc(g.name)}」のイラストをすべて見る（${g.pics}）→</a></p>` : ""}</article>
      <nav class="pager">${newer ? `<a class="btn" href="${esc(newer.url)}">← 新しい投稿</a>` : "<span></span>"}${older ? `<a class="btn" href="${esc(older.url)}">古い投稿 →</a>` : ""}</nav>`;
  }

  function route(){
    const app = $("app");
    let html, path;
    if (B.post){ html = viewPost(B.post); path = `/w/${B.post}/`; }
    else {
      const h = location.hash.replace(/^#\/?/, "").split("/").map(s => { try { return decodeURIComponent(s); } catch { return s; } });
      if (h[0] === "c" && h[1] && h[2] === "t" && h[3]){ html = viewTag(h[1], h[3]); path = `/c/${h[1]}/t/${h[3]}`; }
      else if (h[0] === "c" && h[1]){ html = viewTop(h[1]); path = `/c/${h[1]}`; }
      else if (h[0] === "g" && h[1]){ html = viewGroup(h.slice(1).join("/")); path = `/g/${h.slice(1).join("/")}`; }
      else if (h[0] === "all"){ html = viewAll(); path = "/all"; }
      else { html = viewTop(); path = "/"; }
    }
    app.innerHTML = html;
    return path;
  }
  let lastHash = null;
  function go(scroll){
    if (location.hash !== lastHash){ shown = PAGE; }
    lastHash = location.hash;
    const p = route();
    if (scroll) window.scrollTo(0, 0);
    track(p);
  }

  // ---- load ----
  fetch(`${B.base}/data/site.json`, { cache: "no-cache" })
    .then(r => r.json())
    .then(j => { D = j; })
    .catch(() => {})
    .finally(() => {
      $("count").textContent = D.posts.length;
      const s = D.posts;
      $("range").textContent = s.length ? `${s[s.length-1].date.replaceAll("-", ".")} → ${s[0].date.replaceAll("-", ".")}` : "";
      go(false);
    });
  window.addEventListener("hashchange", () => go(true));

  // ---- interactions ----
  function showLb(){
    const it = lbList[lbIdx];
    $("lbImg").src = it.src;
    $("lbCap").innerHTML = it.caption ? `${esc(it.caption)}<small>${esc(it.label)} · ${esc(it.date.replaceAll("-", "."))}</small>` : `${esc(it.label)}<small>${esc(it.date.replaceAll("-", "."))}</small>`;
    $("lbBar").hidden = lbList.length < 2;
    $("lbCount").textContent = `${lbIdx + 1} / ${lbList.length}`;
  }
  function step(d){ if (lbList.length > 1){ lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); } }
  $("lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
  $("lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
  let sx = null, swiped = false;
  $("lb").addEventListener("touchstart", e => { sx = e.touches[0].clientX; swiped = false; }, { passive: true });
  $("lb").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40){ step(dx < 0 ? 1 : -1); swiped = true; } sx = null; });

  function toast(msg){ const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

  document.addEventListener("click", (e) => {
    const lbBtn = e.target.closest("[data-lb]");
    if (lbBtn){
      const l = lists[lbBtn.dataset.lb]; if (!l || !l.length) return;
      lbList = l; lbIdx = +lbBtn.dataset.i; showLb(); $("lb").hidden = false; return;
    }
    const play = e.target.closest("[data-embed]");
    if (play){
      const kind = play.dataset.kind;
      const f = document.createElement("div");
      f.className = "frame" + (kind === "v" ? " v" : kind === "suno" ? " suno" : "");
      const ifr = document.createElement("iframe");
      ifr.src = play.dataset.embed; ifr.title = "プレーヤー"; ifr.loading = "lazy";
      ifr.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; ifr.allowFullscreen = true;
      f.appendChild(ifr); play.replaceWith(f); return;
    }
    const gol = e.target.closest("[data-go]");
    if (gol){ location.href = gol.dataset.go; return; }
    if (e.target.closest("[data-more]")){ shown += PAGE; const y = window.scrollY; route(); window.scrollTo(0, y); return; }
    const cp = e.target.closest("[data-copy]");
    if (cp){
      const t = cp.dataset.copy;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("リンクをコピーしました"), () => { window.prompt && window.prompt("このリンクをコピーしてください", t); });
      return;
    }
    if (e.target.closest("#lb")){ if (swiped){ swiped = false; return; } $("lb").hidden = true; }
  });
  document.addEventListener("keydown", e => {
    if ($("lb").hidden) return;
    if (e.key === "Escape") $("lb").hidden = true;
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });
  // 右クリック・長押し・ドラッグでの保存を防ぐ
  const guard = (e) => { if (e.target.closest && e.target.closest("img, .shot, .tile, .lb, .cover, .play, .nw, .rc, .gcard")) e.preventDefault(); };
  document.addEventListener("contextmenu", guard);
  document.addEventListener("dragstart", guard);
})();
</script>
</body>
</html>
