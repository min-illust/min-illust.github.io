<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0e0e;
    --ink-2:#1c1b19;
    --paper:#f1ebdd;
    --paper-2:#e6dfcd;
    --red:#e5281e;
    --yellow:#f5d90a;
    --muted:#8a8475;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--ink);color:var(--paper);
    font-family:"Zen Kaku Gothic New",sans-serif;min-height:100vh;
    background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:4px 4px;
  }
  body.lock{overflow:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 64px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ===== HEADER ===== */
  header{position:relative;margin-bottom:22px}
  .now{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.2em;color:var(--yellow)}
  .logo{font-family:"Anton",sans-serif;font-size:76px;line-height:.9;margin:6px 0 4px}
  .logo span{color:var(--red)}
  .sub{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.12em;color:#bdb6a6}
  .stamp{
    position:absolute;right:4px;top:18px;transform:rotate(8deg);
    border:2px solid var(--red);color:var(--red);
    font-family:"Anton",sans-serif;font-size:14px;letter-spacing:.08em;
    padding:6px 10px;line-height:1.15;text-align:center;
  }
  .author{
    display:inline-block;margin-top:14px;background:var(--paper);color:var(--ink);
    font-weight:900;font-size:13px;padding:4px 10px;transform:rotate(-1.5deg);
  }

  .label{
    display:flex;align-items:center;gap:10px;margin:26px 0 12px;
    font-family:"Anton",sans-serif;font-size:24px;letter-spacing:.04em;
  }
  .label::after{content:"";flex:1;height:2px;background:var(--paper)}
  .label small{font-family:"Space Mono",monospace;font-size:11px;color:var(--yellow);letter-spacing:.1em;order:2}
  .label::after{order:3}

  /* ===== PICKUP (NEW / UPDATE) ===== */
  .pickup{
    display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:0 -16px;padding:14px 16px 16px;
    scrollbar-width:none;
  }
  .pickup::-webkit-scrollbar{display:none}
  .pk{
    flex:0 0 138px;scroll-snap-align:start;text-align:left;
    background:var(--yellow);color:var(--ink);padding:8px 8px 10px;position:relative;
    box-shadow:4px 4px 0 var(--red);
  }
  .pk:nth-child(odd){transform:rotate(-1.2deg)}
  .pk:nth-child(even){transform:rotate(1deg)}
  .pk img{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);display:block;background:var(--paper-2)}
  .pk .k{
    position:absolute;top:-9px;left:-5px;font-family:"Anton",sans-serif;font-size:13px;
    letter-spacing:.06em;padding:1px 7px;background:var(--ink);color:var(--yellow);
  }
  .pk .k.new{background:var(--red);color:var(--paper)}
  .pk .n{font-weight:900;font-size:13px;margin-top:6px;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pk .w{font-size:11px;font-weight:700;margin-top:2px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pk .d{font-family:"Space Mono",monospace;font-size:10px;margin-top:4px;opacity:.75}

  /* ===== FILTER BAR (sticky) ===== */
  .filters{
    position:sticky;top:0;z-index:20;
    margin:0 -16px;padding:10px 16px 10px;
    background:rgba(14,14,14,.94);backdrop-filter:blur(6px);
    border-bottom:2px solid var(--paper);
  }
  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--paper);color:var(--ink);padding:0 10px;height:40px;
    border:2px solid var(--paper);
  }
  .search svg{flex:none}
  .search input{
    flex:1;min-width:0;border:none;outline:none;background:transparent;
    font:700 15px "Zen Kaku Gothic New",sans-serif;color:var(--ink);
  }
  .search input::placeholder{color:#8f887a;font-weight:500}
  .clear{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;padding:4px;display:none}
  .clear.on{display:block}

  .cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px;border:2px solid var(--paper)}
  .cat{
    padding:7px 2px;font-weight:900;font-size:12px;text-align:center;
    border-left:2px solid var(--paper);line-height:1.2;
  }
  .cat:first-child{border-left:none}
  .cat.on{background:var(--paper);color:var(--ink)}

  .genres{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .genres::-webkit-scrollbar{display:none}
  .chip{
    flex:none;padding:4px 11px;font-size:12px;font-weight:700;
    border:1.5px solid var(--paper);white-space:nowrap;
  }
  .chip.on{background:var(--red);border-color:var(--red);color:var(--paper)}

  .hint{font-size:10px;color:var(--muted);margin-top:5px}
  .has{display:flex;gap:6px;margin-top:8px}
  .has button{flex:1;padding:5px 0;font-family:"Anton",sans-serif;font-size:13px;letter-spacing:.08em;border:1.5px solid var(--paper)}
  .has button small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;font-weight:700;letter-spacing:0;margin-left:4px}
  .has button.on[data-h="story"]{background:var(--paper);color:var(--ink)}
  .has button.on[data-h="talk"]{background:var(--red);border-color:var(--red)}
  .pk .k.rec{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
  .recs-top .pk{background:var(--paper)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
  .count{font-family:"Space Mono",monospace;font-size:11px;color:var(--yellow);letter-spacing:.06em}
  .tools{display:flex;gap:6px;align-items:center}
  .sort{
    appearance:none;background:transparent;color:var(--paper);
    border:1.5px solid var(--paper);font:700 11px "Zen Kaku Gothic New",sans-serif;
    padding:3px 22px 3px 8px;
    background-image:linear-gradient(45deg,transparent 50%,var(--paper) 50%),linear-gradient(135deg,var(--paper) 50%,transparent 50%);
    background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat;
  }
  .sort option{color:var(--ink)}
  .view{display:flex;border:1.5px solid var(--paper)}
  .view button{padding:3px 6px;display:flex}
  .view button.on{background:var(--paper);color:var(--ink)}

  /* ===== GRID ===== */
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin-top:16px}
  @media(min-width:480px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .cell{text-align:left;position:relative;display:block;width:100%;min-width:0}
  .cell .ph{position:relative;background:var(--paper);padding:4px;box-shadow:3px 3px 0 rgba(229,40,30,.85)}
  .cell img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--paper-2)}
  .cell .nm{font-weight:900;font-size:12px;margin-top:7px;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .gn{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{
    position:absolute;top:-6px;right:-4px;font-family:"Anton",sans-serif;font-size:11px;
    letter-spacing:.05em;padding:0 5px;line-height:1.5;
  }
  .mini.new{background:var(--red);color:var(--paper);transform:rotate(5deg)}
  .mini.up{background:var(--yellow);color:var(--ink);transform:rotate(-4deg)}

  /* ===== LIST VIEW ===== */
  .list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .row{
    display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;text-align:left;
    background:var(--paper);color:var(--ink);padding:8px;position:relative;width:100%;
    box-shadow:3px 3px 0 rgba(229,40,30,.85);
  }
  .row img{width:72px;height:72px;object-fit:cover;border:2px solid var(--ink);display:block}
  .row .nm{font-weight:900;font-size:15px}
  .row .tl{font-size:12px;line-height:1.45;margin-top:2px;color:#2a2722;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .gn{font-size:10px;color:#6b655a;margin-top:3px;font-weight:700}
  .row .mini{top:-7px;right:-5px}

  .empty{text-align:center;padding:40px 0;font-weight:700;color:var(--muted);font-size:14px}
  .empty b{display:block;font-family:"Anton",sans-serif;font-size:28px;color:var(--paper);letter-spacing:.05em;margin-bottom:6px}

  /* ===== DETAIL SHEET ===== */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;
    background:var(--paper);color:var(--ink);
    padding:16px 16px 22px;border-top:4px solid var(--red);
    transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;
  }
  .sheet.on{transform:translateY(0);visibility:visible;transition:transform .25s ease}
  .sheet .close{
    position:absolute;top:10px;right:10px;width:34px;height:34px;
    background:var(--ink);color:var(--paper);font-family:"Anton",sans-serif;font-size:18px;
  }
  .sh-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:end;padding-right:34px}
  .sh-top img{width:120px;height:120px;object-fit:cover;border:3px solid var(--ink);display:block;transform:rotate(-1.5deg);box-shadow:4px 4px 0 var(--red)}
  .sh-badges{display:flex;gap:4px;margin-bottom:6px}
  .bd{font-family:"Anton",sans-serif;font-size:13px;letter-spacing:.06em;padding:1px 7px}
  .bd.new{background:var(--red);color:var(--paper)}
  .bd.up{background:var(--yellow);border:2px solid var(--ink)}
  .sh-title{font-weight:900;font-size:21px;line-height:1.25}
  .sh-cat{font-size:11px;font-weight:700;margin-top:4px;color:#4a463e}
  .sh-genres{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .sg{font-size:11px;font-weight:900;background:var(--red);color:var(--paper);padding:1px 7px}
  .sh-tl{font-size:14px;line-height:1.65;margin-top:14px;white-space:pre-line;overflow-wrap:anywhere}
  .sh-tl.fold{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  /* あらすじ・キャラプロフィール */
  .syn{margin-top:14px}
  .syn h4,.prof h4{font-family:"Anton",sans-serif;font-size:14px;letter-spacing:.1em;color:var(--red)}
  .syn p{font-size:14px;line-height:1.7;margin-top:2px;white-space:pre-line;overflow-wrap:anywhere}
  .prof{margin-top:14px}
  .prof-grid{display:grid;gap:8px;margin-top:4px}
  @media(min-width:480px){.prof-grid.many{grid-template-columns:1fr 1fr}}
  .pf{border:2px solid var(--ink);background:#fbf8f0;padding:8px 10px}
  .pf b{display:block;font-weight:900;font-size:14px}
  .pf dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:4px;font-size:12px}
  .pf dt{font-weight:900;color:#6b655a;white-space:nowrap}
  .pf dd{margin:0;overflow-wrap:anywhere}
  .pf .rest{display:none}
  .pf.open .rest{display:contents}
  .pf button{margin-top:4px;font-size:11px;font-weight:900;color:var(--red);padding:0}
  .bday{display:inline-block;margin-left:6px;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:900;padding:0 6px;border:1.5px solid var(--ink);vertical-align:middle}
  .cake{position:absolute;left:-4px;top:-8px;font-size:18px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
  .tl-more{display:block;margin-top:4px;font-size:12px;font-weight:900;color:var(--red);padding:2px 0}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .tag{font-size:11px;font-weight:700;border:1.5px solid var(--ink);padding:1px 6px;font-family:inherit;color:var(--ink);background:none;cursor:pointer}
  .tag:hover{background:var(--ink);color:var(--paper)}
  .tagon{display:none;margin-top:8px}
  .tagon.on{display:flex;align-items:center;gap:8px}
  .tagon span{font-size:11px;color:var(--muted);font-weight:700}
  .tagon button{background:var(--yellow);color:var(--ink);font-weight:900;font-size:12px;padding:3px 10px}
  .logo a{color:inherit;text-decoration:none}
  .more-works{display:block;text-align:center;text-decoration:none;margin-top:18px;padding:10px 0;background:var(--ink);color:var(--paper);font-family:"Anton",sans-serif;font-size:17px;letter-spacing:.08em}
  .more-works small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;font-weight:700;letter-spacing:0}
  .recs{margin-top:18px;border-top:2px dashed rgba(0,0,0,.3);padding-top:12px}
  .recs h4{font-family:"Anton",sans-serif;font-size:16px;letter-spacing:.08em}
  .recs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px;margin-top:8px}
  .recs-grid a{text-decoration:none;color:var(--ink);min-width:0}
  .recs-grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border:2px solid var(--ink);background:var(--paper-2)}
  .recs-grid p{font-size:11px;font-weight:900;margin-top:4px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-date{font-family:"Space Mono",monospace;font-size:11px;color:#6b655a;margin-top:10px}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btn{
    flex:1;text-align:center;text-decoration:none;
    font-family:"Anton",sans-serif;font-size:19px;letter-spacing:.08em;
    padding:9px 0 8px;border:2px solid var(--ink);
  }
  .btn:active{transform:translate(2px,2px)}
  .btn.story{background:var(--ink);color:var(--paper)}
  .btn.talk{background:var(--red);color:var(--paper);border-color:var(--red)}
  .btn small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;font-weight:700;display:block;letter-spacing:0;margin-top:-1px}
  .hist{margin-top:16px;border-top:2px dashed rgba(0,0,0,.3);padding-top:10px}
  .hist h4{font-family:"Anton",sans-serif;font-size:14px;letter-spacing:.08em}
  .hist li{list-style:none;font-size:12px;padding:3px 0;display:flex;gap:10px}
  .hist li span{font-family:"Space Mono",monospace;font-weight:700;flex:none}


  /* ===== ILLUST GALLERY ===== */
  .gal{margin-top:18px;border-top:2px dashed rgba(0,0,0,.3);padding-top:12px}
  .gal h4{font-family:"Anton",sans-serif;font-size:16px;letter-spacing:.08em;display:flex;align-items:baseline;gap:8px}
  .gal h4 small{font-family:"Space Mono",monospace;font-size:11px;color:#6b655a}
  .gal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
  .gal-grid button{position:relative;display:block;width:100%;aspect-ratio:1;background:var(--paper-2);border:2px solid var(--ink);overflow:hidden}
  .gal-grid img{width:100%;height:100%;object-fit:cover;display:block}
  .gal-grid .more{position:absolute;inset:0;background:rgba(14,14,14,.7);color:var(--paper);
    font-family:"Anton",sans-serif;font-size:20px;display:flex;align-items:center;justify-content:center}
  .gal-note{font-size:12px;color:#6b655a;margin-top:8px}

  .lb{position:fixed;inset:0;z-index:70;background:rgba(10,10,10,.96);display:none;flex-direction:column}
  .lb.on{display:flex}
  .lb-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:var(--paper)}
  .lb-count{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.1em;color:var(--yellow)}
  .lb-x{width:36px;height:36px;background:var(--paper);color:var(--ink);font-family:"Anton",sans-serif;font-size:18px}
  .lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px;touch-action:pan-y}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .lb-cap{padding:10px 16px 22px;color:var(--paper);text-align:center}
  .lb-cap b{font-weight:900;font-size:14px}
  .lb-cap span{display:block;font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);margin-top:2px}
  .lb-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
  .lb-tags button{font-size:12px;font-weight:700;border:1.5px solid var(--paper);color:var(--paper);padding:2px 8px}
  .lb-tags button.ch{background:var(--paper);color:var(--ink)}
  .lb-work{display:inline-block;margin-top:10px;background:var(--red);color:var(--paper);text-decoration:none;font-family:"Anton",sans-serif;font-size:15px;letter-spacing:.06em;padding:6px 14px}
  /* イラスト一覧（タグ・キャラ名から） */
  .illv{display:none;background:var(--paper);color:var(--ink);padding:16px 16px 22px;border-top:4px solid var(--red);box-shadow:5px 5px 0 var(--red)}
  body.ill .illv{display:block}
  body.ill #recLabel,body.ill #rec,body.ill #pickupLabel,body.ill #pickup,body.ill #allTop,body.ill #filters,body.ill #results{display:none}
  .illv .back{font-size:12px;font-weight:900;color:var(--red);text-decoration:none}
  .illv h2{font-weight:900;font-size:22px;line-height:1.3;margin-top:8px;overflow-wrap:anywhere}
  .illv .sub{font-family:"Space Mono",monospace;font-size:11px;color:#6b655a;margin-top:2px}
  .illv .works{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .illv .works a{font-size:12px;font-weight:900;text-decoration:none;color:var(--paper);background:var(--ink);padding:4px 10px}
  .illv .gal-grid button p{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(14,14,14,.8));color:var(--paper);font-size:10px;font-weight:700;padding:10px 4px 3px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;background:rgba(241,235,221,.12);
    color:var(--paper);font-family:"Anton",sans-serif;font-size:22px}
  .lb-nav.p{left:6px}.lb-nav.n{right:6px}

  /* ===== 作品ページ（/chara/w/作品ID/）===== */
  .solo{display:none}
  body.single .solo{display:block;background:var(--paper);color:var(--ink);padding:16px 16px 22px;border-top:4px solid var(--red);box-shadow:5px 5px 0 var(--red)}
  body.single #recLabel,body.single #rec,body.single #pickupLabel,body.single #pickup,body.single #allTop,body.single #filters,body.single #results{display:none}
  body.single .sh-top{padding-right:0}
  .copy{display:block;width:100%;margin-top:16px;padding:8px 0;border:2px dashed var(--ink);font-weight:900;font-size:12px}
  .copy.done{background:var(--ink);color:var(--paper);border-style:solid}

  /* 画像を保存しにくくする（長押し・ドラッグ・選択） */
  img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .lb-stage img,.gal-grid img,.recs-grid img{pointer-events:none}
  footer{margin-top:44px;text-align:center;font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.15em}

  @media(max-width:360px){
    .logo{font-size:62px}
    .sh-top{grid-template-columns:96px 1fr}.sh-top img{width:96px;height:96px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="now">now creating —</p>
    <h1 class="logo"><a href="/chara/">MIN<span>.</span></a></h1>
    <p class="sub">CHARACTER LINKS on キャラぷ</p>
    <div class="stamp">ORIGINAL<br>CHARACTERS</div>
    <p class="author">作者：Min.</p>
  </header>

  <section class="solo" id="solo"></section>
  <section class="illv" id="illv"></section>

  <h2 class="label" id="recLabel">RECOMMEND <small>おすすめ</small></h2>
  <div class="pickup recs-top" id="rec"></div>

  <h2 class="label" id="pickupLabel">NEW &amp; UPDATE <small>← SWIPE</small></h2>
  <div class="pickup" id="pickup"></div>

  <h2 class="label" id="allTop">ALL CHARACTERS</h2>

  <div class="filters" id="filters">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="名前・タグ・キーワードで検索" autocomplete="off">
      <button class="clear" id="clear" aria-label="クリア">✕</button>
    </label>
    <div class="cats" id="cats"></div>
    <div class="genres" id="genres"></div>
    <p class="hint">ジャンルは複数タップで掛け合わせ（例：BL × ファンタジー）</p>
    <div class="has" id="has">
      <button data-h="story">STORY<small>ストーリーあり</small></button>
      <button data-h="talk">TALK<small>トークあり</small></button>
    </div>
    <div class="tagon" id="tagOn"></div>
    <div class="meta">
      <span class="count" id="count"></span>
      <div class="tools">
        <select class="sort" id="sort" aria-label="並び替え">
          <option value="new">新しい順</option>
          <option value="up">更新順</option>
          <option value="name">名前順</option>
        </select>
        <div class="view" id="view">
          <button data-v="grid" class="on" aria-label="グリッド表示">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg>
          </button>
          <button data-v="list" aria-label="リスト表示">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="4" height="4"/><rect x="7" y="3" width="8" height="2"/><rect x="1" y="10" width="4" height="4"/><rect x="7" y="11" width="8" height="2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="results"></div>

  <footer>made by Min.</footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog"></aside>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-bar"><span class="lb-count" id="lbCount"></span><button class="lb-x" id="lbX" aria-label="閉じる">✕</button></div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <button class="lb-nav p" id="lbP" aria-label="前へ">‹</button>
  <button class="lb-nav n" id="lbN" aria-label="次へ">›</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<!--BOOT-->
<script>
// 開くたびに最新のデータを読み込む（ブラウザが古いページを覚えていても、新しいイラストやタグが出るように）
(async () => {
try {
  const B0 = window.__CHARA || {};
  const r = await fetch(`${B0.base || ""}/data/chara.json`, { cache: "no-cache" });
  if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.characters)) window.__CHARA = { ...B0, ...j, single: B0.single }; }
} catch (e) {}
/* ================= 設定 ================= */
const BOOT = window.__CHARA || {characters:[]};
const TODAY = new Date();
const BADGE_DAYS = 14;                  // NEW / UPDATE を出す日数
const PICKUP_MAX = 8;                   // 上部ピックアップの最大数
const GALLERY_PREVIEW = 6;              // 詳細画面に最初に並べるイラスト枚数

const CATEGORIES = BOOT.categories || ["1:1ロールプレイ","シミュレーション"];
const GENRES = BOOT.genres || ["恋愛","日常・現代","ファンタジー","BL","その他"];

/* キャラデータ（管理画面で追加 → 公開時にここへ埋め込まれます） */
const characters = BOOT.characters || [];


/* ================= ユーティリティ ================= */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysAgo=d=>Math.floor((TODAY-new Date(d))/86400000);
const dot=d=>d.replace(/-/g,".");
const md=d=>{const[,m,dd]=d.split("-");return `${+m}/${+dd}`};
function isKyarapu(url){
  try{const u=new URL(url);return u.protocol==="https:"&&(u.hostname==="kyarapu.com"||u.hostname.endsWith(".kyarapu.com"))}
  catch(e){return false}
}
// 全角・半角、ひらがな・カタカナの違いを吸収して検索
const norm=s=>String(s??"").normalize("NFKC").toLowerCase()
  .replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));

function lastUpdate(c){return (c.updates||[]).map(u=>u.date).sort().pop()||""}
function status(c){
  if(daysAgo(c.published)<=BADGE_DAYS) return "new";
  const lu=lastUpdate(c); if(lu&&daysAgo(lu)<=BADGE_DAYS) return "up";
  return "";
}

/* 見本用の顔イラスト（本番はアップした画像） */
const faceCache={};
function face(c,i){
  if(c.thumb) return c.thumb;
  if(faceCache[c.id]) return faceCache[c.id];
  const h=[...c.id].reduce((a,ch)=>a+ch.charCodeAt(0),0)+i;
  const hair=["#1b1b1b","#5a2a1e","#c9b48a","#3b4a6b","#7a1d1d","#e8e3d6"][h%6];
  const bg=["#e5281e","#f5d90a","#0e0e0e","#d9d2c0"][h%4];
  const eye=h%3===0?"M44 62 q6 -5 12 0 M64 62 q6 -5 12 0":"M46 62 l8 0 M66 62 l8 0";
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' fill='${bg}'/>
  <circle cx='60' cy='130' r='48' fill='#f1ebdd' stroke='#0e0e0e' stroke-width='3'/>
  <ellipse cx='60' cy='60' rx='30' ry='34' fill='#f6e2cf' stroke='#0e0e0e' stroke-width='3'/>
  <path d='M28 60 Q28 20 60 20 Q93 20 92 60 Q${80+h%10} 36 ${56+h%14} 36 Q42 46 28 60Z' fill='${hair}' stroke='#0e0e0e' stroke-width='3'/>
  <path d='${eye}' stroke='#0e0e0e' stroke-width='4' fill='none' stroke-linecap='round'/>
  <path d='M54 80 Q60 84 66 80' stroke='#0e0e0e' stroke-width='3' fill='none' stroke-linecap='round'/></svg>`;
  return faceCache[c.id]="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
const idx={}; characters.forEach((c,i)=>idx[c.id]=i);

/* ================= イラスト（公開時に ILLUST LOG から自動で紐づけ済み） ================= */
const illustPosts=[];
const illCache={};
function illustsFor(c){ return illCache[c.id] ||= (c.illusts||[]).map(i=>({...i,wid:c.id,wtitle:c.title})); }
const ALL_ILL=()=>characters.flatMap(illustsFor).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
// イラストのタグ・キャラ名から、イラスト一覧へ（キャラ一覧の中だけで移動）
function goIll(kind,v){
  try{ if(window.goatcounter&&goatcounter.count) goatcounter.count({path:`chara-${kind==="ic"?"chara":"illust-tag"}/${v}`,title:(kind==="ic"?"キャラ：":"イラストのタグ：#")+v,event:true}); }catch(e){}
  setTimeout(()=>{ location.href=`${CHARA_TOP}?${kind}=${encodeURIComponent(v)}`; },120);
}

/* ライトボックス（ページ内で拡大。外部リンクなし） */
const lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg");
let lbList=[],lbI=0;
function lbShow(){const it=lbList[lbI];lbImg.src=it.src;
  document.getElementById("lbCount").textContent=`${lbI+1} / ${lbList.length}`;
  const here=typeof SOLO!=="undefined"&&SOLO&&SOLO.id===it.wid;
  document.getElementById("lbCap").innerHTML=`<b>${esc(it.title)}</b><span>${esc(dot(it.date||""))}${it.wtitle&&it.wtitle!==it.title?` · ${esc(it.wtitle)}`:""}</span>
    <div class="lb-tags">${(it.charas||[]).map(c=>`<button class="ch" data-ic="${esc(c)}">#${esc(c)}</button>`).join("")}${(it.tags||[]).map(t=>`<button data-it="${esc(t)}">#${esc(t)}</button>`).join("")}</div>
    ${it.wid&&!here?`<a class="lb-work" href="${CHARA_TOP}w/${esc(it.wid)}/">この作品を見る →</a>`:""}`;
  document.getElementById("lbP").style.display=document.getElementById("lbN").style.display=lbList.length>1?"":"none";}
function lbOpen(list,i){lbList=list;lbI=i;lbShow();lb.classList.add("on")}
document.getElementById("lbCap").addEventListener("click",e=>{
  const b=e.target.closest("[data-ic],[data-it]"); if(!b) return;
  b.dataset.ic?goIll("ic",b.dataset.ic):goIll("it",b.dataset.it);
});
function lbClose(){lb.classList.remove("on");lbImg.removeAttribute("src")}
const lbStep=d=>{lbI=(lbI+d+lbList.length)%lbList.length;lbShow()};
document.getElementById("lbX").onclick=lbClose;
document.getElementById("lbP").onclick=()=>lbStep(-1);
document.getElementById("lbN").onclick=()=>lbStep(1);
let tx=null;
const st=document.getElementById("lbStage");
st.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
st.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>40&&lbList.length>1)lbStep(dx<0?1:-1)});
st.addEventListener("click",e=>{if(e.target===st)lbClose()});

/* ================= おすすめ（管理画面でチェックした作品） ================= */
(function renderRec(){
  const items=characters.filter(c=>c.featured);
  if(!items.length){document.getElementById("rec").remove();document.getElementById("recLabel").remove();return}
  document.getElementById("rec").innerHTML=items.map(c=>`
    <button class="pk" data-id="${esc(c.id)}">
      <span class="k rec">PICK</span>
      <img src="${face(c,idx[c.id])}" alt="">
      <p class="n">${esc(c.title)}</p>
      <p class="w">${esc((c.charas||[]).join("・")||c.category)}</p>
    </button>`).join("");
})();

/* ================= ピックアップ ================= */
(function renderPickup(){
  const ev=[];
  characters.forEach(c=>{
    if(daysAgo(c.published)<=BADGE_DAYS) ev.push({c,date:c.published,text:"新キャラ公開",k:"new"});
    (c.updates||[]).forEach(u=>{ if(daysAgo(u.date)<=BADGE_DAYS) ev.push({c,date:u.date,text:u.text,k:"up"}) });
  });
  ev.sort((a,b)=>b.date.localeCompare(a.date));
  const seen=new Set(), items=[];
  for(const e of ev){ if(seen.has(e.c.id)) continue; seen.add(e.c.id); items.push(e); if(items.length>=PICKUP_MAX) break; }
  if(!items.length){document.getElementById("pickup").remove();document.getElementById("pickupLabel").remove();return}
  document.getElementById("pickup").innerHTML=items.map(e=>`
    <button class="pk" data-id="${esc(e.c.id)}">
      <span class="k ${e.k}">${e.k==="new"?"NEW":"UPDATE"}</span>
      <img src="${face(e.c,idx[e.c.id])}" alt="">
      <p class="n">${esc(e.c.title)}</p>
      <p class="w">${esc(e.text)}</p>
      <p class="d">${md(e.date)}</p>
    </button>`).join("");
})();

/* ================= 絞り込み ================= */
const state={q:"",cat:"all",genres:new Set(),sort:"new",view:"grid",tag:"",has:new Set()};
const CHARA_TOP=`${BOOT.base||""}/chara/`;
document.querySelector(".logo a").href=CHARA_TOP;
try{ state.tag=new URLSearchParams(location.search).get("tag")||""; }catch(e){}

document.getElementById("cats").innerHTML=
  [["all","すべて"],...CATEGORIES.map(c=>[c,c])].map(([v,l])=>
    `<button class="cat${v==="all"?" on":""}" data-v="${esc(v)}">${esc(l)}</button>`).join("");
document.getElementById("genres").innerHTML=
  [["all","ALL"],...GENRES.map(g=>[g,g])].map(([v,l])=>
    `<button class="chip${v==="all"?" on":""}" data-v="${esc(v)}">${esc(l)}</button>`).join("");

function filtered(){
  const q=norm(state.q).trim().split(/\s+/).filter(Boolean);
  let arr=characters.filter(c=>{
    if(state.cat!=="all"&&c.category!==state.cat) return false;
    if(state.tag&&!(c.tags||[]).some(t=>norm(t)===norm(state.tag))) return false;
    if(state.has.has("story")&&!c.story) return false;
    if(state.has.has("talk")&&!c.talk) return false;
    for(const g of state.genres){ if(!(c.genres||[]).includes(g)) return false; }
    if(q.length){
      // イラストに付けたタグ・キャラ名・一言も検索の対象に
      const ill=(c.illusts||[]).flatMap(i=>[i.title,...(i.tags||[]),...(i.charas||[])]);
      const hay=norm([c.title,c.tagline,...(c.genres||[]),c.category,...(c.tags||[]),...(c.charas||[]),c.synopsis,...(c.profiles||[]).flatMap(pf=>[pf.name,...pf.items.map(i=>i.value)]),...ill].join(" "));
      if(!q.every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  if(state.sort==="new") arr.sort((a,b)=>b.published.localeCompare(a.published));
  if(state.sort==="up")  arr.sort((a,b)=>(lastUpdate(b)||b.published).localeCompare(lastUpdate(a)||a.published));
  if(state.sort==="name")arr.sort((a,b)=>a.title.localeCompare(b.title,"ja"));
  return arr;
}

function render(){
  const arr=filtered(), box=document.getElementById("results");
  const to=document.getElementById("tagOn");
  to.classList.toggle("on",!!state.tag);
  to.innerHTML=state.tag?`<span>タグで絞り込み中</span><button id="tagOff">#${esc(state.tag)} ✕</button>`:"";
  if(state.tag) document.getElementById("tagOff").onclick=()=>setTag("");
  document.getElementById("count").textContent=`${arr.length} / ${characters.length} CHARA`;
  if(!arr.length){box.innerHTML=`<p class="empty"><b>NO HIT</b>条件に合うキャラがいません</p>`;return}
  const badge=c=>{const s=status(c);return (hasBday(c)?`<span class="cake" title="今日が誕生日">🎂</span>`:"")+(s?`<span class="mini ${s}">${s==="new"?"NEW":"UP"}</span>`:"")};
  if(state.view==="grid"){
    box.innerHTML=`<div class="grid">${arr.map(c=>`
      <button class="cell" data-id="${esc(c.id)}">
        <div class="ph"><img src="${face(c,idx[c.id])}" alt="" loading="lazy">${badge(c)}</div>
        <p class="nm">${esc(c.title)}</p>
        <p class="gn">${c.category==="シミュレーション"?"シミュ｜":""}${esc((c.genres||[]).join(" / "))}</p>
      </button>`).join("")}</div>`;
  }else{
    box.innerHTML=`<div class="list">${arr.map(c=>`
      <button class="row" data-id="${esc(c.id)}">
        <img src="${face(c,idx[c.id])}" alt="" loading="lazy">
        <div><p class="nm">${esc(c.title)}</p><p class="tl">${esc(c.tagline)}</p>
        <p class="gn">${esc(c.category)}｜${esc((c.genres||[]).join(" / "))}</p></div>${badge(c)}
      </button>`).join("")}</div>`;
  }
}

// タグで絞り込み（URLにも残すので、共有・戻るでも同じ状態になる）
// アクセス解析（GoatCounter）にタグのクリックを記録
function countTag(t){ try{ if(t&&window.goatcounter&&goatcounter.count) goatcounter.count({path:"chara-tag/"+t,title:"タグ：#"+t,event:true}); }catch(e){} }
function setTag(t){
  countTag(t);
  state.tag=t;
  try{ history.replaceState(null,"",t?`?tag=${encodeURIComponent(t)}`:location.pathname); }catch(e){}
  render(); jumpToResults();
}
function setOn(groupId,val){
  document.querySelectorAll(`#${groupId} [data-v]`).forEach(b=>b.classList.toggle("on",b.dataset.v===val));
}
function jumpToResults(){
  const top=document.getElementById("allTop").getBoundingClientRect().top+scrollY;
  if(scrollY>top) scrollTo({top,behavior:"smooth"});
}
document.getElementById("cats").addEventListener("click",e=>{
  const b=e.target.closest("[data-v]");if(!b)return;state.cat=b.dataset.v;setOn("cats",state.cat);render();jumpToResults()});
document.getElementById("genres").addEventListener("click",e=>{
  const b=e.target.closest("[data-v]");if(!b)return;
  const v=b.dataset.v;
  if(v==="all") state.genres.clear();
  else state.genres.has(v)?state.genres.delete(v):state.genres.add(v);
  document.querySelectorAll("#genres [data-v]").forEach(x=>x.classList.toggle("on",
    x.dataset.v==="all"?state.genres.size===0:state.genres.has(x.dataset.v)));
  render();jumpToResults()});
document.getElementById("has").addEventListener("click",e=>{
  const b=e.target.closest("[data-h]");if(!b)return;
  const h=b.dataset.h; state.has.has(h)?state.has.delete(h):state.has.add(h);
  b.classList.toggle("on",state.has.has(h)); render(); jumpToResults()});
document.getElementById("view").addEventListener("click",e=>{
  const b=e.target.closest("[data-v]");if(!b)return;state.view=b.dataset.v;setOn("view",state.view);render()});
document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;render()});
const qEl=document.getElementById("q"), clr=document.getElementById("clear");
qEl.addEventListener("input",()=>{state.q=qEl.value;clr.classList.toggle("on",!!qEl.value);render()});
clr.addEventListener("click",e=>{e.preventDefault();qEl.value="";state.q="";clr.classList.remove("on");render();qEl.focus()});

/* ================= 詳細シート ================= */
const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
let openId=null, galAll=false;
// ===== キャラプロフィール（誕生日の当日は🎂） =====
const JST=new Date(Date.now()+9*3600e3), TM=JST.getUTCMonth()+1, TD=JST.getUTCDate();
const isBday=pf=>pf.bm===TM&&pf.bd===TD;
const hasBday=c=>(c.profiles||[]).some(isBday);
const PF_SHOW=4; // 最初に見せる行数（残りは「もっと見る」）
function profilesHTML(c){
  const ps=c.profiles||[]; if(!ps.length) return "";
  return `<div class="prof"><h4>PROFILE</h4><div class="prof-grid${ps.length>1?" many":""}">${ps.map(pf=>{
    const rows=[...(pf.birthday?[["誕生日",pf.birthday]]:[]),...pf.items.map(i=>[i.label,i.value])];
    const html=rows.map(([k,v],i)=>`${i===PF_SHOW?'<div class="rest">':""}<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")+(rows.length>PF_SHOW?"</div>":"");
    return `<div class="pf"><b>${esc(pf.name)}${isBday(pf)?`<span class="bday">🎂 HAPPY BIRTHDAY</span>`:""}</b><dl>${html}</dl>${rows.length>PF_SHOW?`<button data-pf="1">もっと見る ▼</button>`:""}</div>`;
  }).join("")}</div></div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-pf]"); if(!b) return;
  const card=b.closest(".pf"); const open=card.classList.toggle("open");
  b.textContent=open?"閉じる ▲":"もっと見る ▼";
});
// 紹介文が長いときは4行で畳む（イラストまでのスクロールを短く）
const longTl=t=>{const s=String(t||"");return s.split("\n").length>4||s.length>110};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tl]"); if(!b) return;
  const p=b.previousElementSibling; const open=p.classList.toggle("fold");
  b.textContent=open?"続きを読む ▼":"閉じる ▲";
});
// 作品の詳細（一覧のシートと、作品ページの両方で使う）
function detailHTML(c,all,solo){
  const ill=illustsFor(c);
  const shown=all?ill:ill.slice(0,GALLERY_PREVIEW);
  const rest=ill.length-shown.length;
  const galHTML=`<div class="gal"><h4>ILLUST <small>${ill.length?ill.length+" 枚":""}</small></h4>${
    ill.length?`<div class="gal-grid">${shown.map((im,k)=>`<button data-gi="${k}"><img src="${esc(im.thumb)}" alt="" loading="lazy">${
      (k===shown.length-1&&rest>0)?`<span class="more" data-more="1">+${rest}</span>`:""}</button>`).join("")}</div>`
    :`<p class="gal-note">まだイラストはありません</p>`}</div>`;
  const s=status(c), lu=lastUpdate(c);
  const story=c.story&&isKyarapu(c.story), talk=c.talk&&isKyarapu(c.talk);
  const hist=[...(c.updates||[])].sort((a,b)=>b.date.localeCompare(a.date));
  return `
    ${solo?"":`<button class="close" id="closeSheet" aria-label="閉じる">✕</button>`}
    <div class="sh-top">
      <img src="${face(c,idx[c.id])}" alt="${esc(c.title)}">
      <div>
        <div class="sh-badges">${s==="new"?`<span class="bd new">NEW</span>`:s==="up"?`<span class="bd up">UPDATE</span>`:""}</div>
        ${solo?`<h2 class="sh-title">${esc(c.title)}</h2>`:`<h3 class="sh-title">${esc(c.title)}</h3>`}
        <p class="sh-cat">${esc(c.category)}</p>
        <div class="sh-genres">${(c.genres||[]).map(g=>`<span class="sg">${esc(g)}</span>`).join("")}</div>
      </div>
    </div>
    ${c.synopsis?`<div class="syn"><h4>あらすじ</h4><p>${esc(c.synopsis)}</p></div>`:longTl(c.tagline)?`<p class="sh-tl fold">${esc(c.tagline)}</p><button class="tl-more" data-tl="1">続きを読む ▼</button>`:`<p class="sh-tl">${esc(c.tagline)}</p>`}
    ${profilesHTML(c)}
    <div class="tags">${(c.tags||[]).map(t=>`<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>
    <p class="sh-date">RELEASE ${dot(c.published)}${lu?` / UPDATE ${dot(lu)}`:""}</p>
    <div class="btns">
      ${story?`<a class="btn story" href="${esc(c.story)}" target="_blank" rel="noopener">STORY<small>ストーリー</small></a>`:""}
      ${talk?`<a class="btn talk" href="${esc(c.talk)}" target="_blank" rel="noopener">TALK<small>トーク</small></a>`:""}
    </div>
    ${galHTML}
    ${hist.length?`<div class="hist"><h4>UPDATE LOG</h4><ul>${hist.map(u=>`<li><span>${dot(u.date)}</span>${esc(u.text)}</li>`).join("")}</ul></div>`:""}
    <button class="copy" data-share="1">この作品をシェア</button>
    ${solo?recsHTML(c)+`<a class="more-works" href="${CHARA_TOP}">ほかの作品を見る →<small>Min.のキャラクター一覧</small></a>`:""}`;
}
// 同じタグの作品（共通タグが多い順→新しい順・最大6件）
function recsHTML(c){
  const mine=new Set((c.tags||[]).map(norm));
  const list=characters.filter(x=>x.id!==c.id).map(x=>({x,n:(x.tags||[]).filter(t=>mine.has(norm(t))).length}))
    .filter(r=>r.n>0).sort((a,b)=>b.n-a.n||b.x.published.localeCompare(a.x.published)).slice(0,6);
  if(!list.length) return "";
  return `<div class="recs"><h4>同じタグの作品</h4><div class="recs-grid">${list.map(({x})=>
    `<a href="${CHARA_TOP}w/${esc(x.id)}/"><img src="${face(x,idx[x.id])}" alt="" loading="lazy"><p>${esc(x.title)}</p></a>`).join("")}</div></div>`;
}
function bindTags(root,solo){
  root.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.tag;
    if(solo){ countTag(t); setTimeout(()=>{location.href=`${CHARA_TOP}?tag=${encodeURIComponent(t)}`},150); return; }
    closeSheet(); setTag(t);
  });
}
function bindGallery(root,c,onMore){
  const ill=illustsFor(c);
  root.querySelectorAll("[data-gi]").forEach(b=>b.onclick=e=>{
    if(e.target.closest("[data-more]")){onMore();return}
    lbOpen(ill,+b.dataset.gi)});
}
const workUrl=c=>`${location.origin}${BOOT.base||""}/chara/w/${c.id}/`;
function openSheet(id,refresh){
  const c=characters.find(x=>x.id===id); if(!c) return;
  if(!refresh) galAll=false;
  openId=id;
  sheet.innerHTML=detailHTML(c,galAll,false);
  sheet.classList.add("on");scrim.classList.add("on");document.body.classList.add("lock");
  document.getElementById("closeSheet").onclick=closeSheet;
  bindGallery(sheet,c,()=>{galAll=true;openSheet(id,true)});
  bindShare(sheet,c);
  bindTags(sheet,false);
}
// シェア：スマホは共有メニュー、使えないときはURLをコピー
function bindShare(root,c){
  const b=root.querySelector("[data-share]"); if(!b) return;
  b.onclick=async()=>{
    const url=workUrl(c), title=`${c.title}｜Min.`;
    if(navigator.share){ try{await navigator.share({title,url});}catch(e){} return; }
    try{await navigator.clipboard.writeText(url);b.textContent="URLをコピーしました";b.classList.add("done")}
    catch(e){prompt("この作品のURL",url)}
  };
}
function closeSheet(){openId=null;sheet.classList.remove("on");scrim.classList.remove("on");document.body.classList.remove("lock")}
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{
  if(lb.classList.contains("on")){if(e.key==="Escape")lbClose();if(e.key==="ArrowLeft")lbStep(-1);if(e.key==="ArrowRight")lbStep(1);return}
  if(e.key==="Escape")closeSheet()});
document.addEventListener("click",e=>{
  const t=e.target.closest(".pk,.cell,.row"); if(t&&!sheet.contains(t)) openSheet(t.dataset.id);
});

/* ================= 画像の保存よけ（右クリック・長押しメニュー・ドラッグ） ================= */
["contextmenu","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.target.closest&&e.target.closest("img,.lb,.gal-grid,.recs-grid,.sh-top,.pk,.cell,.row")) e.preventDefault();
}));

/* ================= 作品ページ（その作品だけを表示） ================= */
const ILLQ=(()=>{try{const q=new URLSearchParams(location.search);if(q.get("ic"))return{kind:"ic",v:q.get("ic")};if(q.get("it"))return{kind:"it",v:q.get("it")};}catch(e){}return{};})();
const SOLO=BOOT.single&&characters.find(c=>c.id===BOOT.single);
if(SOLO){
  document.body.classList.add("single");
  const box=document.getElementById("solo");
  box.innerHTML=detailHTML(SOLO,true,true);   // 作品ページではイラストを最初から全部並べる
  bindGallery(box,SOLO,()=>{});
  bindShare(box,SOLO);
  bindTags(box,true);
}else if(ILLQ.kind){
  // ?it=タグ（イラストのタグ） / ?ic=キャラ名 のイラスト一覧
  document.body.classList.add("ill");
  const v=ILLQ.v, nv=norm(v);
  const list=ALL_ILL().filter(i=>ILLQ.kind==="ic"?(i.charas||[]).some(c=>norm(c)===nv):(i.tags||[]).some(t=>norm(t)===nv));
  const works=[...new Map(list.map(i=>[i.wid,i.wtitle])).entries()];
  const box=document.getElementById("illv");
  box.innerHTML=`<a class="back" href="${CHARA_TOP}">← すべての作品へ</a>
    <h2>${ILLQ.kind==="ic"?esc(v):"#"+esc(v)}<small style="font-size:13px;font-weight:700"> のイラスト</small></h2>
    <p class="sub">${list.length} 枚</p>
    ${works.length?`<div class="works">${works.map(([id,t])=>`<a href="${CHARA_TOP}w/${esc(id)}/">${esc(t)} →</a>`).join("")}</div>`:""}
    ${list.length?`<div class="gal-grid">${list.map((im,k)=>`<button data-li="${k}"><img src="${esc(im.thumb)}" alt="" loading="lazy"><p>${esc(ILLQ.kind==="ic"?im.title:(im.charas||[]).join("・")||im.wtitle)}</p></button>`).join("")}</div>`:`<p class="gal-note">まだイラストはありません</p>`}`;
  box.querySelectorAll("[data-li]").forEach(b=>b.onclick=()=>lbOpen(list,+b.dataset.li));
  document.title=`${ILLQ.kind==="ic"?v:"#"+v} のイラスト｜Min.`;
}else{
  render();
  // タグ付きで来たときは、絞り込んだ一覧まで下げて見せる
  if(state.tag) requestAnimationFrame(()=>document.getElementById("allTop").scrollIntoView());
}
})();
</script>
<!-- ホーム画面から開いたとき（アドレスバーがない）だけ出る更新ボタン -->
<button id="hsReload" type="button" aria-label="最新に更新" style="display:none;position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;font:700 13px system-ui,sans-serif;background:#141312;color:#fff;border:2px solid #fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.35)">↻ 更新</button>
<script>
(function(){
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var b = document.getElementById("hsReload"); if (!standalone || !b) return;
  b.style.display = "block";
  b.onclick = function(){
    try {
      var u = new URL(location.href); u.searchParams.set("r", Date.now().toString(36)); // 古いページを使わずに読み直す
      location.replace(u.toString());
    } catch (e) { location.reload(); }
  };
})();
</script>
